<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <base id="reploid-base" href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Reploid</title>
    <script>
    window.REPLOID_BUILD_VERSION = '2026081002';
      window.REPLOID_SW_VERSION = window.REPLOID_BUILD_VERSION;
      window.REPLOID_VFS_VERSION = window.REPLOID_BUILD_VERSION;
    </script>
    <link rel="stylesheet" href="/styles/rd.css" />
    <link rel="stylesheet" href="/styles/boot.css" />
  </head>
  <body>
    <div id="wizard-container" class="wizard-container" style="display: none"></div>
    <div id="app"></div>
    <script
      type="module"
    >
      const pathname = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
      const productPaths = new Set([
        '/',
        '/compute',
        '/ask',
        '/records',
        '/room-1',
        '/history',
        '/network'
      ]);
      const productRoute = productPaths.has(pathname);
      const ensurePooldayStylesheet = () => {
        const version = encodeURIComponent(window.REPLOID_BUILD_VERSION || '');
        // Layer order is load order: tokens -> primitives -> components.
        for (const layer of ['tokens', 'primitives', 'components']) {
          const id = `poolday-route-stylesheet-${layer}`;
          if (document.getElementById(id)) continue;
          const link = document.createElement('link');
          link.id = id;
          link.rel = 'stylesheet';
          link.href = `/styles/poolday/${layer}.css?v=${version}`;
          document.head.appendChild(link);
        }
      };
      const ROOT_SW_RELEASE_RELOAD_KEY = 'REPLOID_ROOT_SW_RELEASE_RELOAD';
      const PRODUCT_BOOT_RECOVERY_KEY = `REPLOID_PRODUCT_BOOT_RECOVERY:${window.REPLOID_BUILD_VERSION}`;
      const PRODUCT_BOOT_TIMEOUT_MS = 10000;
      const readProductBootRecovery = () => {
        try {
          return sessionStorage.getItem(PRODUCT_BOOT_RECOVERY_KEY) === 'true';
        } catch {
          return false;
        }
      };
      const writeProductBootRecovery = (active) => {
        try {
          if (active) sessionStorage.setItem(PRODUCT_BOOT_RECOVERY_KEY, 'true');
          else sessionStorage.removeItem(PRODUCT_BOOT_RECOVERY_KEY);
        } catch {
          // Storage is optional. The visible terminal error still prevents a blank page.
        }
      };
      const showProductBootFailure = (appRoot) => {
        appRoot.replaceChildren();
        const failure = document.createElement('main');
        failure.className = 'pool-boot-failure';
        failure.setAttribute('role', 'alert');
        failure.textContent = 'Reploid could not load. Reload the page to try again.';
        appRoot.appendChild(failure);
      };
      const replaceForProductBootRecovery = () => {
        const retryUrl = new URL(window.location.href);
        retryUrl.searchParams.set('reploidBootRetry', window.REPLOID_BUILD_VERSION);
        window.location.replace(retryUrl.toString());
      };
      const clearProductBootRecoveryUrl = () => {
        const currentUrl = new URL(window.location.href);
        if (!currentUrl.searchParams.has('reploidBootRetry')) return;
        currentUrl.searchParams.delete('reploidBootRetry');
        window.history.replaceState(window.history.state, '', `${currentUrl.pathname}${currentUrl.search}${currentUrl.hash}`);
      };
      const loadProductRouteModule = async () => {
        let timeoutId;
        try {
          return await Promise.race([
            import('/ui/pool-home/index.js'),
            new Promise((_, reject) => {
              timeoutId = window.setTimeout(() => {
                reject(new Error('Reploid product route module load timed out'));
              }, PRODUCT_BOOT_TIMEOUT_MS);
            })
          ]);
        } finally {
          window.clearTimeout(timeoutId);
        }
      };
      const bootProductRoute = async (appRoot) => {
        try {
          const { initPoolHome } = await loadProductRouteModule();
          initPoolHome(appRoot);
          writeProductBootRecovery(false);
          clearProductBootRecoveryUrl();
        } catch (error) {
          if (!readProductBootRecovery()) {
            writeProductBootRecovery(true);
            replaceForProductBootRecovery();
            return;
          }
          writeProductBootRecovery(false);
          showProductBootFailure(appRoot);
          throw error;
        }
      };
      const releaseGlobalReploidServiceWorker = async () => {
        if (!('serviceWorker' in navigator)) return false;
        try {
          const registrations = await navigator.serviceWorker.getRegistrations?.();
          const rootRegistrations = (registrations || []).filter((registration) => {
            const scopeUrl = new URL(registration.scope);
            return scopeUrl.origin === window.location.origin && scopeUrl.pathname === '/';
          });
          if (rootRegistrations.length === 0) {
            sessionStorage.removeItem(ROOT_SW_RELEASE_RELOAD_KEY);
            return false;
          }
          const controlsCurrentPage = !!navigator.serviceWorker.controller;
          await Promise.all(rootRegistrations.map((registration) => registration.unregister()));
          if (controlsCurrentPage && sessionStorage.getItem(ROOT_SW_RELEASE_RELOAD_KEY) !== 'true') {
            sessionStorage.setItem(ROOT_SW_RELEASE_RELOAD_KEY, 'true');
            window.location.reload();
            return new Promise(() => {});
          }
          sessionStorage.removeItem(ROOT_SW_RELEASE_RELOAD_KEY);
          return true;
        } catch {
          return false;
        }
      };
      if (productRoute) {
        document.title = 'Reploid';
      } else if (pathname === '/zero') {
        document.title = 'Zero';
      } else if (pathname === '/x') {
        document.title = 'X';
      } else {
        document.title = 'Reploid';
      }
      if (productRoute) {
        ensurePooldayStylesheet();
        await releaseGlobalReploidServiceWorker();
        const appRoot = document.getElementById('app');
        if (!appRoot) {
          throw new Error('Missing app root');
        }
        await bootProductRoute(appRoot);
      } else {
        const bootPath = `/kernel/boot.js?v=${window.REPLOID_BUILD_VERSION}`;
        await import(bootPath);
      }
    </script>
  </body>
</html>
