apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: reploid-pool
  labels:
    app: reploid-pool
    product: browser-inference-pool
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/reploid/reploid/reploid-pool:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: POOL_BACKEND_ONLY
              value: "true"
            - name: POOL_STORE
              value: firestore
            - name: POOL_VERIFY_FIREBASE_AUTH
              value: "true"
            - name: POOL_REQUIRE_FIREBASE_AUTH
              value: "true"
            - name: POOL_JSON_LIMIT
              value: 512kb
            - name: POOL_SIGNAL_SESSION_TTL_MS
              value: "600000"
            - name: POOL_MAX_SIGNAL_PAYLOAD_BYTES
              value: "65536"
            - name: POOL_MAX_SIGNAL_MESSAGES_PER_POLL
              value: "100"
            - name: REPLOID_ADAPTER_GCS_SIGNED_URLS
              value: "true"
            - name: REPLOID_ADAPTER_SIGNED_URL_TTL_MS
              value: "300000"
            - name: REPLOID_POOL_MODEL_BASE_URL
              value: "https://storage.googleapis.com/reploid-model-artifacts/models"
            - name: REPLOID_DOPPLER_MODULE_URL
              value: "https://cdn.jsdelivr.net/npm/doppler-gpu@0.5.1/src/index.js"
            - name: REPLOID_DOPPLER_KERNEL_BASE_URL
              value: "https://cdn.jsdelivr.net/npm/doppler-gpu@0.5.1/src/gpu/kernels"
            - name: REPLOID_TURN_HOST
              value: "34.57.174.48"
            - name: REPLOID_TURN_CREDENTIAL_TTL_SECONDS
              value: "600"
            - name: REPLOID_TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: reploid-turn-shared-secret
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
