substitutions:
  _REGION: us-central1
  _SERVICE: reploid-pool
  _REPOSITORY: reploid
  _IMAGE: reploid-pool

steps:
  - id: render-env
    name: node:22-slim
    entrypoint: bash
    args:
      - -lc
      - node scripts/print-pool-env.js deploy/env.production.json > /workspace/.pool-env

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest
      - .

  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        gcloud run deploy ${_SERVICE} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --min-instances 0 \
          --max-instances 1 \
          --concurrency 80 \
          --timeout 300 \
          --set-secrets REPLOID_TURN_SHARED_SECRET=reploid-turn-shared-secret:latest \
          --set-env-vars "$(cat /workspace/.pool-env),REPLOID_RELEASE_SOURCE_REVISION=$COMMIT_SHA,REPLOID_RELEASE_IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA"
        gcloud run services update-traffic ${_SERVICE} \
          --region ${_REGION} \
          --platform managed \
          --to-latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest
