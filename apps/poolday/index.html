<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <script id="reploid-landing-attribution">
      (() => {
        // The landing URL may already be in hosting logs, so this is hygiene, not a log eraser.
        if (location.origin !== 'https://replo.id' || location.pathname !== '/') return;
        const parts = location.search.slice(1).split('&');
        const tags = new URLSearchParams(location.search).getAll('v');
        if (tags.length === 0) return;
        const remaining = parts.filter(part => !new URLSearchParams('?' + part).has('v')).join('&');
        try {
          history.replaceState(history.state, '', location.pathname + (remaining ? '?' + remaining : '') + location.hash);
        } catch {
          return;
        }
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
        const tag = tags[0];
        if (tags.length !== 1 || tag.length !== 4 || !/^[A-Za-z0-9_-]{4}$/.test(tag) ||
            alphabet[(alphabet.indexOf(tag[0]) + alphabet.indexOf(tag[1]) + alphabet.indexOf(tag[2])) % 64] !== tag[3] ||
            navigator.globalPrivacyControl === true || navigator.doNotTrack === '1') return;
        // This is a best-effort count, never a requirement for loading Poolday.
        try {
          void fetch('/api/landing-attribution', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ v: tag }), credentials: 'omit',
            referrerPolicy: 'no-referrer', mode: 'same-origin', keepalive: true
          }).catch(() => {});
        } catch { /* attribution must not interrupt boot */ }
      })();
    </script>
    <base id="reploid-base" href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Reploid</title>
    <script>
    window.REPLOID_BUILD_VERSION = '2026091901';
      window.REPLOID_SW_VERSION = window.REPLOID_BUILD_VERSION;
      window.REPLOID_VFS_VERSION = window.REPLOID_BUILD_VERSION;
    </script>
    <script>
      if (location.pathname.replace(/\/+$/, '') !== '/zero') {
        for (const href of ['/styles/rd.css', '/styles/boot.css']) {
          const link = document.createElement('link');
          link.rel = 'stylesheet'; link.href = href; document.head.appendChild(link);
        }
      }
    </script>
  </head>
  <body>
    <div id="wizard-container" class="wizard-container" style="display: none"></div>
    <div id="app"></div>
    <script
      type="module"
    >
      const pathname = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
      const productPaths = new Set([
        '/',
        '/compute',
        '/ask',
        '/records',
        '/room-1',
        '/history',
        '/network',
        '/work',
        '/improve',
        '/examples'
      ]);
      const productRoute = productPaths.has(pathname);
      // Keep this synchronous boot list aligned with styles/poolday/layers.json.
      const pooldayStylesheets = ["tokens.css", "primitives/base.css", "primitives/surfaces.css", "primitives/controls.css", "primitives/choices.css", "primitives/layout.css", "primitives/text.css", "primitives/optical.css", "primitives/workspace.css", "primitives/messages.css", "compositions/screens.css", "compositions/conversation.css", "compositions/interaction.css", "compositions/mobile-navigation.css"];
      const ensurePooldayStylesheet = () => {
        const version = encodeURIComponent(window.REPLOID_BUILD_VERSION || '');
        // Layer order is load order: tokens -> primitives -> components.
        for (const file of pooldayStylesheets) {
          const layer = file.replace(/\.css$/, '').replaceAll('/', '-');
          const id = `poolday-route-stylesheet-${layer}`;
          if (document.getElementById(id)) continue;
          const link = document.createElement('link');
          link.id = id;
          link.rel = 'stylesheet';
          link.href = `/styles/poolday/${file}?v=${version}`;
          document.head.appendChild(link);
        }
      };
      const ROOT_SW_RELEASE_RELOAD_KEY = 'REPLOID_ROOT_SW_RELEASE_RELOAD';
      const PRODUCT_BOOT_RECOVERY_KEY = `REPLOID_PRODUCT_BOOT_RECOVERY:${window.REPLOID_BUILD_VERSION}`;
      const PRODUCT_BOOT_TIMEOUT_MS = 10000;
      const readProductBootRecovery = () => {
        if (new URL(window.location.href).searchParams.get('reploidBootRetry') === String(window.REPLOID_BUILD_VERSION)) return true;
        try {
          return sessionStorage.getItem(PRODUCT_BOOT_RECOVERY_KEY) === 'true';
        } catch {
          return false;
        }
      };
      const writeProductBootRecovery = (active) => {
        try {
          if (active) sessionStorage.setItem(PRODUCT_BOOT_RECOVERY_KEY, 'true');
          else sessionStorage.removeItem(PRODUCT_BOOT_RECOVERY_KEY);
        } catch {
          // The URL marker bounds recovery when storage is unavailable.
        }
      };
      const showProductBootFailure = (appRoot) => {
        appRoot.replaceChildren();
        const failure = document.createElement('main');
        failure.className = 'pool-boot-failure';
        failure.setAttribute('role', 'alert');
        failure.textContent = 'Reploid could not load. Reload the page to try again.';
        appRoot.appendChild(failure);
      };
      const replaceForProductBootRecovery = () => {
        const retryUrl = new URL(window.location.href);
        retryUrl.searchParams.set('reploidBootRetry', window.REPLOID_BUILD_VERSION);
        window.location.replace(retryUrl.toString());
      };
      const clearProductBootRecoveryUrl = () => {
        const currentUrl = new URL(window.location.href);
        if (!currentUrl.searchParams.has('reploidBootRetry')) return;
        currentUrl.searchParams.delete('reploidBootRetry');
        window.history.replaceState(window.history.state, '', `${currentUrl.pathname}${currentUrl.search}${currentUrl.hash}`);
      };
      // The conversation workspace (/ and /network) is the React product (apps/poolday-react); the specialist routes keep the vanilla shell.
      const productBundle = ['/', '/network'].includes((window.location.pathname || '/').replace(/\/+$/, '') || '/')
        ? '/ui/react/app.js' : '/ui/pool-home/app.bundle.js';
      const loadProductRoute = async (appRoot) => {
        let timeoutId;
        const controller = new AbortController();
        try {
          return await Promise.race([
            (async () => {
              await releaseGlobalReploidServiceWorker(controller.signal);
              controller.signal.throwIfAborted();
              const { initPoolHome } = await import(productBundle);
              controller.signal.throwIfAborted();
              return initPoolHome(appRoot, { signal: controller.signal });
            })(),
            new Promise((_, reject) => {
              timeoutId = window.setTimeout(() => {
                const error = new Error('Reploid startup timed out');
                controller.abort(error);
                reject(error);
              }, PRODUCT_BOOT_TIMEOUT_MS);
            })
          ]);
        } finally {
          window.clearTimeout(timeoutId);
        }
      };
      const bootProductRoute = async (appRoot) => {
        try {
          await loadProductRoute(appRoot);
          writeProductBootRecovery(false);
          clearProductBootRecoveryUrl();
        } catch (error) {
          if (!readProductBootRecovery()) {
            writeProductBootRecovery(true);
            replaceForProductBootRecovery();
            return;
          }
          writeProductBootRecovery(false);
          showProductBootFailure(appRoot);
          throw error;
        }
      };
      const releaseGlobalReploidServiceWorker = async (signal) => {
        if (!('serviceWorker' in navigator)) return false;
        try {
          const registrations = await navigator.serviceWorker.getRegistrations?.();
          signal.throwIfAborted();
          const rootRegistrations = (registrations || []).filter((registration) => {
            const scopeUrl = new URL(registration.scope);
            return scopeUrl.origin === window.location.origin && scopeUrl.pathname === '/';
          });
          if (rootRegistrations.length === 0) {
            sessionStorage.removeItem(ROOT_SW_RELEASE_RELOAD_KEY);
            return false;
          }
          const controlsCurrentPage = !!navigator.serviceWorker.controller;
          await Promise.all(rootRegistrations.map((registration) => registration.unregister()));
          signal.throwIfAborted();
          if (controlsCurrentPage && sessionStorage.getItem(ROOT_SW_RELEASE_RELOAD_KEY) !== 'true') {
            sessionStorage.setItem(ROOT_SW_RELEASE_RELOAD_KEY, 'true');
            window.location.reload();
            return new Promise(() => {});
          }
          sessionStorage.removeItem(ROOT_SW_RELEASE_RELOAD_KEY);
          return true;
        } catch {
          return false;
        }
      };
      if (productRoute) {
        document.title = 'Reploid';
      } else if (pathname === '/zero') {
        document.title = 'Zero';
      } else if (pathname === '/x') {
        document.title = 'X';
      } else {
        document.title = 'Reploid';
      }
      if (productRoute) {
        ensurePooldayStylesheet();
        const appRoot = document.getElementById('app');
        if (!appRoot) {
          throw new Error('Missing app root');
        }
        await bootProductRoute(appRoot);
      } else if (pathname === '/zero') {
        const { bootZero } = await import('/zero/boot.js');
        await bootZero();
      } else {
        const bootPath = `/kernel/boot.js?v=${window.REPLOID_BUILD_VERSION}`;
        await import(bootPath);
      }
    </script>
  </body>
</html>
