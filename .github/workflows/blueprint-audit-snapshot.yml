name: Blueprint audit snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build audit snapshot
        run: |
          mkdir -p audit-snapshot
          cp -R self audit-snapshot/self
          cp -R scripts audit-snapshot/scripts
          cp -R tests audit-snapshot/tests
          for path in docs server config .github README.md AGENTS.md package.json package-lock.json; do
            if [ -e "$path" ]; then cp -R "$path" audit-snapshot/; fi
          done
          printf '%s\n' "$(git rev-parse HEAD)" > audit-snapshot/COMMIT_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: reploid-blueprint-audit-snapshot
          path: audit-snapshot
          if-no-files-found: error
          retention-days: 3
