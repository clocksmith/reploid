name: Smoke

# Build the browser bundle and the hosting payload from this commit's source.
# Verify the source-to-vendor library mirror before building.
# Browser bundle freshness, application unit, browser and release checks stay manual.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: node --test tests/scripts/sync-reploid-library.test.js
      - run: npm run verify:library
      - run: npm ci --omit=optional --no-audit --no-fund
      - run: npm run build:browser-bundle
      - run: npm run package:hosting
