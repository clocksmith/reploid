name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check JavaScript correctness
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Verify surface and runtime contracts
      run: |
        npm run verify:catscan
        npm run verify:surface-claims
        npm run verify:layers
        npm run verify:library-types
        npm run verify:module-system
        npm run verify:registry
        npm run verify:runtime-config
        npm run verify:browser-bundle:local
        npm run verify:change-passport:sdk
        npm run verify:change-passport:pilot
        npm exec -- tsc -p tsconfig.change-passport.json --noEmit
        npm run verify:pool

    - name: Install contract browser
      run: npx playwright install --with-deps chromium

    - name: Browser infrastructure and product contracts
      env:
        REPLOID_E2E_ARTIFACT_DIR: artifacts/product-browser-ci
      run: >-
        npx playwright test
        tests/e2e/vfs-storage-contract.spec.js
        tests/e2e/boot.spec.js
        tests/e2e/peer-pack-jobs.spec.js
        tests/e2e/work-integration.spec.js
        tests/e2e/work-clarity.spec.js
        tests/e2e/agent-network-home.spec.js
        tests/e2e/tool-offer-exchange.spec.js
        tests/e2e/peer-tool-offer.spec.js
        --project=chromium --workers=1

    - name: Installed package acceptance
      run: node tests/library-package-acceptance.js

    - name: Archive test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-node-22
        path: |
          coverage/
          test-results/
          playwright-report/
          artifacts/library-acceptance/
          artifacts/product-browser-ci/

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check code formatting
      run: npm run format:check --if-present
      continue-on-error: true

    - name: Check for security vulnerabilities
      run: npm audit --production --audit-level=moderate
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project (if configured)
      run: npm run build --if-present

    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-artifacts
        path: |
          dist/
        retention-days: 7
