name: Smoke

# Build the browser bundle and the hosting payload from this commit's source.
# Verify the source-to-vendor library mirror before building.
# Focused boundary/lifecycle regressions run here; broad application, browser and release checks stay manual.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - name: JavaScript only (no Python or Go files or processes)
        run: node scripts/verify-js-only.js
      - run: node --test tests/scripts/sync-reploid-library.test.js tests/scripts/retained-evidence.test.js
      - run: npm run verify:library
      - run: node scripts/restore-evidence.js --validate
      - run: npm ci --omit=optional --no-audit --no-fund
      # Vitest needs Rollup's native parser. Keep unrelated GPU/provider optional
      # packages omitted and install only this runner's lockfile-pinned package.
      - name: Install test parser
        run: |
          ROLLUP_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@rollup/rollup-linux-x64-gnu'].version")
          npm install --no-save --ignore-scripts --omit=optional --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"
          git diff --exit-code -- package.json package-lock.json
      - run: npm run verify:fleet-receipts
      - name: Check changed code and source boundaries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          node scripts/lint-changed-code.js --base "$BASE_SHA"
          node scripts/check-artifact-additions.js --base "$BASE_SHA"
          node scripts/verify-layers.js --source-only
          npm run verify:library-types
          npm run verify:poolday-types
          npx vitest run --config tests/vitest.config.js tests/unit/browser-library-config.test.js tests/unit/library-export-entries.test.js tests/unit/computer-record-contracts.test.js tests/unit/weight-supply-contracts.test.js tests/unit/weight-supply.test.js tests/unit/transport-message-registration.test.js tests/integration/weight-supply-transport.test.js tests/unit/chat-session-failover.test.js tests/unit/chat-execution-lifecycle.test.js tests/unit/automatic-ordered-assignment.test.js tests/unit/partition-stage-assignment.test.js tests/unit/automatic-ordered-partitions.test.js tests/unit/proxy-config.test.js tests/integration/proxy-import.test.js tests/unit/pool-hash-compatibility.test.js tests/unit/peer-diagnostic-shipping-boundary.test.js tests/unit/hosting-file-set.test.js tests/unit/error-taxonomy.test.js tests/unit/self-authorization.test.js tests/unit/zero-goals.test.js tests/unit/federated-disclosure.test.js tests/unit/rule-matching.test.js tests/unit/verification-worker-prototype.test.js tests/unit/artifact-additions.test.js tests/unit/observer-errors.test.js tests/unit/peer-timing.test.js tests/unit/bridge-files.test.js tests/unit/runtime-config-sync.test.js tests/unit/pool-peer-control-plane.test.js tests/unit/pool-peer-room.test.js tests/unit/first-visitor.test.js tests/unit/first-answer-defaults.test.js tests/unit/pool-home-simulation.test.js tests/unit/conversation-workspace.test.js tests/unit/conversation-attachments.test.js tests/unit/cloudflare-sqlite-firestore.test.js tests/unit/hosted-api-origin.test.js tests/unit/zero-capsule-image.test.js tests/unit/x-extends-zero.test.js tests/unit/critical-user-journeys.test.js tests/unit/tool-surfaces.test.js tests/unit/shared-file-inventory.test.js tests/unit/weight-supply-host.test.js tests/unit/work-swarm-weight-supply.test.js tests/unit/work-model-files-weight-supply.test.js
          npx vitest run --config tests/vitest.config.js tests/unit/browser-boundaries.test.js tests/unit/proto-export.test.js tests/unit/layer-verification.test.js tests/unit/eslint-environments.test.js tests/integration/fleet-browser-bridge.test.js tests/integration/fleet-ledger-edge-worker.test.js tests/unit/work-resident-provider.test.js tests/unit/network-controls.test.js tests/unit/execution-privacy.test.js tests/unit/auxiliary-privacy.test.js tests/integration/execution-privacy-routes.test.js tests/integration/retrieval-privacy.test.js tests/unit/doppler-runtime-service.test.js tests/unit/doppler-boundary-real-package.test.js tests/unit/doppler-kebab-enum-compat.test.js tests/unit/trained-adapter-admission.test.js tests/unit/work-generation-completion.test.js tests/unit/pool-peer-operation-planning.test.js tests/unit/pool-peer-pack-job.test.js tests/unit/work-threads.test.js tests/unit/operation-participation-lifecycle.test.js tests/unit/privacy-controls.test.js tests/unit/peer-generation-threads.test.js tests/unit/chat-workspace.test.js tests/unit/chat-thread-grants.test.js tests/unit/conversation-remote-permission.test.js tests/unit/ordered-partition-grants.test.js tests/unit/ordered-partition-chat-entry.test.js tests/unit/settlement-failed-stage-forfeits.test.js tests/unit/settlement-failure-cases.test.js tests/unit/settlement-old-rules.test.js tests/unit/settlement-own-stage-ledger.test.js tests/unit/settlement-pinned-terms.test.js tests/unit/settlement-replay-encoding.test.js tests/unit/settlement-replay.test.js tests/unit/settlement-signed-accounts.test.js tests/unit/settlement-terms-before-k.test.js tests/unit/settlement-v2-rules.test.js tests/unit/credit-ledger.test.js tests/integration/whole-model-signed-charge.test.js
      - name: Check complete-request lifecycle and owned process boundaries
        run: npx vitest run --config tests/vitest.config.js tests/unit/native-complete-request.test.js tests/unit/native-complete-lifecycle.test.js tests/unit/complete-request-timing.test.js tests/unit/complete-worker-protocol.test.js tests/unit/complete-request-client.test.js tests/unit/provider-state.test.js tests/unit/native-lifecycle-runner.test.js tests/unit/compare-complete-preflight.test.js tests/unit/compare-split-single-clock.test.js tests/unit/native-piece-cache-source.test.js tests/unit/native-diagnostic-source.test.js
      - name: Check execution policy at CLI and research entrypoints
        run: npx vitest run --config tests/vitest.config.js tests/unit/chat-catalog-modes.test.js tests/unit/native-node-ask.test.js tests/unit/research-plugin-host.test.js
      - name: Check the scoring rollout against an older release (recorded transcript) and the native operation port
        run: npx vitest run --config tests/vitest.config.js tests/unit/scoring-rollout-old-peers.test.js tests/unit/native-mesh-operation-send.test.js tests/unit/mesh-operation-dispatch.test.js tests/unit/target-scoring.test.js
      - run: npx --no-install eslint --config scripts/eslint.config.js .
      - name: Verify committed generated contracts and inventories
        run: |
          npm run verify:registry
          npm run verify:catscan
          npm run verify:zero-source
          npm run verify:x-extension
          npm run verify:self-source
          npm run verify:doppler-generation
          npm run verify:ownership-inventory
          npm run verify:runtime-config
          npm run verify:hosting-config
          npm run verify:module-system
          npm run verify:change-passport:sdk
          npm run verify:browser-bundle:local
          npm run verify:planning-boundary
          npm run verify:emoji
          npm run verify:surface-claims
          npm run verify:journeys
      - run: npm run build:browser-bundle
      - run: npm run package:hosting

  design-system:
    # The Poolday UI uses only @reploid/poolday-ui: no raw elements, ad hoc styles or forbidden
    # imports outside the design system, tokens only, a framework-free API bridge, and a guard
    # against reintroducing vanilla UI. These checks run without a browser.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      # Installed as the smoke job installs: esbuild's own install step fetches this runner's binary when
      # optional packages are omitted, so scripts must run here.
      - run: npm ci --omit=optional --no-audit --no-fund
      - name: Install test parser
        run: |
          ROLLUP_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@rollup/rollup-linux-x64-gnu'].version")
          npm install --no-save --ignore-scripts --omit=optional --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"
          git diff --exit-code -- package.json package-lock.json
      - run: npm run verify:poolday-ui
      - run: npm run verify:pool:css
      - run: npm run test:poolday-ui

  mobile:
    # apps/mobile/tool/check.sh: format, analysis, boundaries, the generated contract and design tokens
    # against their JavaScript/CSS sources, the four test packages and an independent consumer.
    # No path filter: the app's parity tests run the web client's own provider code and the shared
    # conformance vectors, so a change almost anywhere in the requester path can break them.
    # No platform builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      # The parity tests start tests/fixtures/requester-conformance/stdio-provider.js, which imports
      # the web client's modules.
      - run: npm ci --omit=optional --no-audit --no-fund
      - name: Read the pinned Flutter version
        id: flutter-pin
        run: echo "version=$(tr -d '[:space:]' < apps/mobile/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true
      - name: Check the Flutter app
        env:
          # A missing Node provider fails the parity tests instead of skipping them.
          REPLOID_MOBILE_REQUIRE_PROVIDER: '1'
        run: bash apps/mobile/tool/check.sh

  ui-keyboard:
    # Keyboard, focus and narrow-screen checks of the Poolday interface (tests/playwright.ui.config.js):
    # headless Chromium with the GPU disabled and no WebGPU, a scripted executor, no model.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --omit=optional --no-audit --no-fund
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e:ui
