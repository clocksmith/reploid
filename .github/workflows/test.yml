name: Smoke

# Build the browser bundle and the hosting payload from this commit's source.
# Verify the source-to-vendor library mirror before building.
# Focused boundary/lifecycle regressions run here; broad application, browser and release checks stay manual.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: node --test tests/scripts/sync-reploid-library.test.js tests/scripts/retained-evidence.test.js
      - run: npm run verify:library
      - run: node scripts/restore-evidence.js --validate
      - run: npm ci --omit=optional --no-audit --no-fund
      # Vitest needs Rollup's native parser. Keep unrelated GPU/provider optional
      # packages omitted and install only this runner's lockfile-pinned package.
      - name: Install test parser
        run: |
          ROLLUP_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@rollup/rollup-linux-x64-gnu'].version")
          npm install --no-save --ignore-scripts --omit=optional --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"
          git diff --exit-code -- package.json package-lock.json
      - name: Check changed code and source boundaries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          node scripts/lint-changed-code.js --base "$BASE_SHA"
          node scripts/check-artifact-additions.js --base "$BASE_SHA"
          node scripts/verify-layers.js --source-only
          npm run verify:library-types
          npm run verify:poolday-types
          npx vitest run --config tests/vitest.config.js tests/unit/proxy-config.test.js tests/integration/proxy-import.test.js tests/unit/pool-hash-compatibility.test.js tests/unit/self-authorization.test.js tests/unit/zero-goals.test.js tests/unit/federated-disclosure.test.js tests/unit/rule-matching.test.js tests/unit/verification-worker-prototype.test.js tests/unit/artifact-additions.test.js
          npx vitest run --config tests/vitest.config.js tests/unit/browser-boundaries.test.js tests/unit/layer-verification.test.js tests/unit/eslint-environments.test.js tests/integration/fleet-browser-bridge.test.js tests/unit/work-resident-provider.test.js tests/unit/network-controls.test.js tests/unit/execution-privacy.test.js tests/unit/auxiliary-privacy.test.js tests/integration/execution-privacy-routes.test.js tests/integration/retrieval-privacy.test.js tests/integration/privacy-native-webrtc.test.js tests/unit/doppler-runtime-service.test.js tests/unit/work-generation-completion.test.js tests/unit/pool-peer-operation-planning.test.js tests/unit/pool-peer-pack-job.test.js tests/unit/work-threads.test.js tests/unit/operation-participation-lifecycle.test.js tests/unit/privacy-controls.test.js tests/unit/peer-generation-threads.test.js tests/unit/chat-workspace.test.js tests/unit/chat-thread-grants.test.js tests/unit/conversation-remote-permission.test.js tests/unit/ordered-partition-grants.test.js tests/unit/ordered-partition-chat-entry.test.js
      - name: Verify committed generated contracts and inventories
        run: |
          npm run lint
          npm run verify:registry
          npm run verify:catscan
          npm run verify:zero-source
          npm run verify:doppler-generation
          npm run verify:ownership-inventory
          npm run verify:runtime-config
          npm run verify:module-system
          npm run verify:change-passport:sdk
          npm run verify:browser-bundle:local
      - run: npm run build:browser-bundle
      - run: npm run package:hosting
