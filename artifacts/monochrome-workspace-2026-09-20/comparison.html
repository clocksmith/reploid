<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reploid workspace: before / after</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #ededed; color: #222; font: 16px/1.5 system-ui, sans-serif; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { max-width: 85ch; }
  nav { display: flex; flex-wrap: wrap; gap: 24px; margin: 24px 0; }
  label { display: grid; gap: 4px; }
  select { padding: 8px; font: inherit; }
  main { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 24px; align-items: start; }
  figure { margin: 0; }
  figcaption { font-weight: 600; margin-bottom: 12px; }
  img { display: block; width: 100%; height: auto; border: 1px solid #aaa; }
  body[data-width="390"] main { max-width: 900px; margin-inline: auto; }
</style>
<h1>Reploid workspace: before / after</h1>
<p>Before: commit 9529cb37. After: monochrome material repair. Chromium screenshots use injected host states to exercise presentation and visible consent; they do not establish model execution or peer independence.</p>
<nav aria-label="Screenshot selection">
  <label>Theme <select id="theme"><option>light</option><option>dark</option></select></label>
  <label>Viewport <select id="width"><option value="1440">Desktop · 1440 px</option><option value="390">Mobile · 390 px</option></select></label>
  <label>State <select id="state"><option>empty</option><option>active</option><option>approval</option><option>completed</option></select></label>
</nav>
<main>
  <figure><figcaption>Before</figcaption><img id="before" alt="Workspace before repair"></figure>
  <figure><figcaption>After</figcaption><img id="after" alt="Workspace after repair"></figure>
</main>
<script>
  const controls = ['theme', 'width', 'state'].map(id => document.getElementById(id));
  function update() {
    const suffix = controls.map(control => control.value).join('-');
    document.body.dataset.width = controls[1].value;
    for (const phase of ['before', 'after']) document.getElementById(phase).src = `${phase}-${suffix}.png`;
  }
  controls.forEach(control => control.addEventListener('change', update));
  update();
</script>
</html>
