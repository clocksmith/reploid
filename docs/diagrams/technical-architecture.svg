<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Reploid: technical architecture</title><desc id="desc">Blue distributed ownership shows durable conversations using a general N-stage route, illustrated by five computers. The first contributor owns the coordinator, intermediate stages forward activations and token context, and the last samples and decodes. Each computer retains reusable weights and separate admitted request state; storage contributes pieces independently. This is intended architecture, not qualification evidence.</desc>
