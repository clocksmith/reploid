<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Reploid: technical architecture</title>
<desc id="desc">Ten components connect persistent conversations to discovery, admission, authorized model-piece preparation, and two Doppler executors. Activations travel from A to B; selected tokens return to the coordinator for the next step. Weight delivery and contribution permission are separate from requester input disclosure.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{font-size:14px;font-weight:500;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style>
