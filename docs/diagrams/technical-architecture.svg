<g data-component="Conversation UI"><rect x="64" y="130" width="296" height="98" rx="10" fill="#ffffff" stroke="#16181d" stroke-width="1.3"/>
<text x="82" y="151" font-size="11" fill="#16181d" font-weight="600" text-anchor="start">REQUESTER · NO WEIGHTS</text>
<text x="82" y="176" font-size="19" fill="#16181d" font-weight="600" text-anchor="start">Conversation UI</text>
<text x="82" y="199" font-size="14" fill="#626976" font-weight="400" text-anchor="start">Prompt, disclosure, stream, Stop</text>
</g>
<g data-component="Conversation workspace"><rect x="452" y="130" width="296" height="98" rx="10" fill="#ffffff" stroke="#16181d" stroke-width="1.3"/>
<text x="470" y="151" font-size="11" fill="#16181d" font-weight="600" text-anchor="start">APPLICATION</text>
<text x="470" y="176" font-size="19" fill="#16181d" font-weight="600" text-anchor="start">Conversation workspace</text>
<text x="470" y="199" font-size="14" fill="#626976" font-weight="400" text-anchor="start">Threads, grants, isolated attempts</text>
</g>
<g data-component="Persistent history"><rect x="840" y="130" width="296" height="98" rx="10" fill="#f2f6ff" stroke="#245cd6" stroke-width="1.3"/>
<text x="858" y="151" font-size="11" fill="#245cd6" font-weight="600" text-anchor="start">LOCAL STORAGE</text>
<text x="858" y="176" font-size="19" fill="#16181d" font-weight="600" text-anchor="start">Persistent history</text>
<text x="858" y="199" font-size="14" fill="#626976" font-weight="400" text-anchor="start">Drafts, partial answers, retries</text>
</g>
<g data-component="Discovery"><rect x="64" y="310" width="296" height="98" rx="10" fill="#f7f3ff" stroke="#7441ce" stroke-width="1.3"/>
<text x="82" y="331" font-size="11" fill="#7441ce" font-weight="600" text-anchor="start">OBSERVATION</text>
<text x="82" y="356" font-size="19" fill="#16181d" font-weight="600" text-anchor="start">Discovery</text>
<text x="82" y="379" font-size="14" fill="#626976" font-weight="400" text-anchor="start">Capabilities and readiness expire</text>
</g>
<g data-component="Placement + admission"><rect x="452" y="310" width="296" height="98" rx="10" fill="#f7f3ff" stroke="#7441ce" stroke-width="1.3"/>
<text x="470" y="331" font-size="11" fill="#7441ce" font-weight="600" text-anchor="start">COORDINATION</text>
<text x="470" y="356" font-size="19" fill="#16181d" font-weight="600" text-anchor="start">Placement + admission</text>
<text x="470" y="379" font-size="14" fill="#626976" font-weight="400" text-anchor="start">Compatible split, scoped reservations</text>
</g>
<g data-component="Contribution controls"><rect x="840" y="310" width="296" height="98" rx="10" fill="#ffffff" stroke="#16181d" stroke-width="1.3"/>
<text x="858" y="331" font-size="11" fill="#16181d" font-weight="600" text-anchor="start">PARTICIPANT CHOICE</text>
<text x="858" y="356" font-size="19" fill="#16181d" font-weight="600" text-anchor="start">Contribution controls</text>
<text x="858" y="379" font-size="14" fill="#626976" font-weight="400" text-anchor="start">Compute and file-sharing permissions</text>
</g>
<g data-component="Partition coordinator"><rect x="64" y="510" width="296" height="98" rx="10" fill="#f7f3ff" stroke="#7441ce" stroke-width="1.3"/>
<text x="82" y="531" font-size="11" fill="#7441ce" font-weight="600" text-anchor="start">REPLOID ON A</text>
<text x="82" y="556" font-size="19" fill="#16181d" font-weight="600" text-anchor="start">Partition coordinator</text>
<text x="82" y="579" font-size="14" fill="#626976" font-weight="400" text-anchor="start">Ordered steps, cancellation, settlement</text>
</g>
<g data-component="Executor A · Doppler"><rect x="452" y="510" width="296" height="98" rx="10" fill="#fff3f5" stroke="#d52749" stroke-width="1.3"/>
<text x="470" y="531" font-size="11" fill="#d52749" font-weight="600" text-anchor="start">PHYSICAL COMPUTER A</text>
<text x="470" y="556" font-size="19" fill="#16181d" font-weight="600" text-anchor="start">Executor A · Doppler</text>
<text x="470" y="579" font-size="14" fill="#626976" font-weight="400" text-anchor="start">First layers; own attention / state</text>
</g>
<g data-component="Executor B · Doppler"><rect x="840" y="510" width="296" height="98" rx="10" fill="#fff3f5" stroke="#d52749" stroke-width="1.3"/>
<text x="858" y="531" font-size="11" fill="#d52749" font-weight="600" text-anchor="start">PHYSICAL COMPUTER B</text>
<text x="858" y="556" font-size="19" fill="#16181d" font-weight="600" text-anchor="start">Executor B · Doppler</text>
<text x="858" y="579" font-size="14" fill="#626976" font-weight="400" text-anchor="start">Remaining layers; sampling; own state</text>
</g>
<g data-component="Authorized piece custody"><rect x="840" y="710" width="296" height="98" rx="10" fill="#f2f6ff" stroke="#245cd6" stroke-width="1.3"/>
<text x="858" y="731" font-size="11" fill="#245cd6" font-weight="600" text-anchor="start">STORAGE PARTICIPANTS</text>
<text x="858" y="756" font-size="19" fill="#16181d" font-weight="600" text-anchor="start">Authorized piece custody</text>
<text x="858" y="779" font-size="14" fill="#626976" font-weight="400" text-anchor="start">Supplier offers, verification, limits</text>
</g>
<text x="64" y="743" font-size="16" fill="#16181d" font-weight="600" text-anchor="start">The decode loop returns a selected token, not a second answer.</text>
<text x="64" y="770" font-size="15" fill="#626976" font-weight="400" text-anchor="start">A → B carries activations and token context over WebRTC.</text>
<text x="64" y="795" font-size="15" fill="#626976" font-weight="400" text-anchor="start">Each attempt closes on both executors; weights can remain resident.</text>
<text x="64" y="857" font-size="14" fill="#626976" font-weight="400" text-anchor="start">Purple: coordination / grants · Blue: storage / pieces · Red: inference · Dashed: availability</text>
</svg>
