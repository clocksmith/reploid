<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 1135" width="1550" height="1135" font-family="Arial, Helvetica, sans-serif"><title>Reploid · Doppler · Doe — One operation</title><desc>Whole-request example through an optional Doe provider. A model split requires additional execution-peer lifelines. Intended architecture, not proof of implementation.</desc><rect width="100%" height="100%" fill="#e9e9e9"/><text x="48" y="48" font-size="27" font-weight="600" fill="#202020" text-anchor="start"><tspan x="48" dy="0">Reploid · Doppler · Doe</tspan></text><text x="48" y="79" font-size="15" font-weight="400" fill="#646464" text-anchor="start"><tspan x="48" dy="0">Whole-request example through an optional Doe provider. A model split requires additional execution-peer lifelines.</tspan></text><defs><filter id="soft" x="-25%" y="-35%" width="155%" height="180%"><feDropShadow dx="8" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/><feDropShadow dx="-7" dy="-7" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.88"/></filter></defs><path d="M140,210 V1100" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 7"/><path d="M530,210 V1100" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 7"/><path d="M975,210 V1100" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 7"/><path d="M1400,210 V1100" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 7"/><path d="M25,720 H1525" stroke="#cccccc"/><text x="30" y="708" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="30" dy="0">IF EXECUTION FAILS · recovery is explicit, scoped and authorized</tspan></text><g data-edge="s1" tabindex="0" role="button" aria-label="1  Send message in a thread"><path d="M140,265 L530,265" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M140,265 L530,265" fill="none" stroke="transparent" stroke-width="22"/><polygon points="530,265 519,270.28 519,259.72" fill="#373737"/><