<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1270" width="1760" height="1270" font-family="Arial, Helvetica, sans-serif"><title>Reploid · Doppler · Doe — Stream</title><desc>Remote whole-request example. Provider is selected once: Doe OR an environment-supported alternative, never both by implication. Intended architecture, not proof of implementation.</desc><rect width="100%" height="100%" fill="#e9e9e9"/><text x="48" y="48" font-size="27" font-weight="600" fill="#202020" text-anchor="start"><tspan x="48" dy="0">Reploid · Doppler · Doe</tspan></text><text x="48" y="79" font-size="15" font-weight="400" fill="#646464" text-anchor="start"><tspan x="48" dy="0">Remote whole-request example. Provider is selected once: Doe OR an environment-supported alternative, never both by implication.</tspan></text><defs><filter id="soft" x="-25%" y="-35%" width="155%" height="180%"><feDropShadow dx="8" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/><feDropShadow dx="-7" dy="-7" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.88"/></filter></defs><path d="M212.5,272 V1110" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 7"/><path d="M657.5,272 V1110" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 7"/><path d="M1102.5,272 V1110" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 7"/><path d="M1547.5,272 V1110" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 7"/><path d="M25,635 H1735" stroke="#cccccc"/><text x="30" y="623" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="30" dy="0">LOOP · repeat bounded computation and ordered output; cancellation or failure may branch at any iteration</tspan></text><path d="M25,955 H1735" stroke="#cccccc"/><text x="30" y="943" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="30" dy="0">SUCCESS BRANCH ONLY · final output must meet the requester’s acceptance contract</tspan></text><g data-edge="request" tabindex="0" role="button" aria-label="Authorize and send exact request"><path d="M212.5,335 L657.5,335" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M212.5,335 L657.5,335" fill="none" stroke="transparent" stroke-width="22"/><polygon points="657.5,335 646.5,340.28 646.5,329.72" fill="#373737"/><text x="435" y="317" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="435" dy="0">Authorize and send exact request</tspan></text></g><g data-edge="begin" tabindex="0" role="button" aria-label="Begin identified attempt"><path d="M657.5,410 L1102.5,410" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M657.5,410 L1102.5,410" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1102.5,410 1091.5,415.28 1091.5,404.72" fill="#373737"/><text x="880" y="392" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="880" dy="0">Begin identified attempt</tspan></text></g><g data-edge="prepare" tabindex="0" role="button" aria-label="Prepare resources and programs"><path d="M1102.5,485 L1547.5,485" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M1102.5,485 L1547.5,485" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1547.5,485 1536.5,490.28 1536.5,479.72" fill="#373737"/><text x="1325" y="467" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1325" dy="0">Prepare resources and programs</tspan></text></g><g data-edge="ready" tabindex="0" role="button" aria-label="Ready, or branch on failure"><path d="M1547.5,555 L1102.5,555" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M1547.5,555 L1102.5,555" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1102.5,555 1113.5,549.72 1113.5,560.28" fill="#373737"/><text x="1325" y="537" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1325" dy="0">Ready, or branch on failure</tspan></text></g><g data-edge="compute" tabindex="0" role="button" aria-label="Submit next model computation"><path d="M1102.5,690 L1547.5,690" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M1102.5,690 L1547.5,690" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1547.5,690 1536.5,695.28 1536.5,684.72" fill="#373737"/><text x="1325" y="672" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1325" dy="0">Submit next model computation</tspan></text></g><g data-edge="computed" tabindex="0" role="button" aria-label="Completion and observations"><path d="M1547.5,755 L1102.5,755" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M1547.5,755 L1102.5,755" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1102.5,755 1113.5,749.72 1113.5,760.28" fill="#373737"/><text x="1325" y="737" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1325" dy="0">Completion and observations</tspan></text></g><g data-edge="delta" tabindex="0" role="button" aria-label="Event {attemptId, sequence}"><path d="M1102.5,820 L657.5,820" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M1102.5,820 L657.5,820" fill="none" stroke="transparent" stroke-width="22"/><polygon points="657.5,820 668.5,814.72 668.5,825.28" fill="#373737"/><text x="880" y="802" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="880" dy="0">Event {attemptId, sequence}</tspan></text></g><g data-edge="deliver" tabindex="0" role="button" aria-label="Bound event → same message"><path d="M657.5,885 L212.5,885" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M657.5,885 L212.5,885" fill="none" stroke="transparent" stroke-width="22"/><polygon points="212.5,885 223.5,879.72 223.5,890.28" fill="#373737"/><text x="435" y="867" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="435" dy="0">Bound event → same message</tspan></text></g><g data-edge="complete" tabindex="0" role="button" aria-label="Final output + execution identity"><path d="M1102.5,1020 L657.5,1020" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M1102.5,1020 L657.5,1020" fill="none" stroke="transparent" stroke-width="22"/><polygon points="657.5,1020 668.5,1014.72 668.5,1025.28" fill="#373737"/><text x="880" y="1002" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="880" dy="0">Final output + execution identity</tspan></text></g><g data-edge="accept" tabindex="0" role="button" aria-label="Completion → requester acceptance"><path d="M657.5,1090 L212.5,1090" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M657.5,1090 L212.5,1090" fill="none" stroke="transparent" stroke-width="22"/><polygon points="212.5,1090 223.5,1084.72 223.5,1095.28" fill="#373737"/><text x="435" y="1072" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="435" dy="0">Completion → requester acceptance</tspan></text></g><g data-node="Q" tabindex="0" role="button" aria-label="Reploid + Poolday: Requesting peer" style="cursor:grab"><rect x="45" y="150" width="335" height="112" rx="17" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="63" y="186" font-size="22" font-weight="600" fill="#202020" text-anchor="start"><tspan x="63" dy="0">Reploid + Poolday</tspan></text><text x="63" y="215" font-size="14" font-weight="400" fill="#646464" text-anchor="start"><tspan x="63" dy="0">Requesting peer</tspan></text></g><g data-node="R" tabindex="0" role="button" aria-label="Receiving interface: Execution peer · Reploid + Poolday" style="cursor:grab"><rect x="490" y="150" width="335" height="112" rx="17" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="508" y="186" font-size="22" font-weight="600" fill="#202020" text-anchor="start"><tspan x="508" dy="0">Receiving interface</tspan></text><text x="508" y="215" font-size="14" font-weight="400" fill="#646464" text-anchor="start"><tspan x="508" dy="0">Execution peer · Reploid + Poolday</tspan></text></g><g data-node="RUN" tabindex="0" role="button" aria-label="Doppler Run: Execution peer · model component" style="cursor:grab"><rect x="935" y="150" width="335" height="112" rx="17" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="953" y="186" font-size="22" font-weight="600" fill="#202020" text-anchor="start"><tspan x="953" dy="0">Doppler Run</tspan></text><text x="953" y="215" font-size="14" font-weight="400" fill="#646464" text-anchor="start"><tspan x="953" dy="0">Execution peer · model component</tspan></text></g><g data-node="GPU" tabindex="0" role="button" aria-label="Selected GPU provider: Doe OR a supported alternative" style="cursor:grab"><rect x="1380" y="150" width="335" height="112" rx="17" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1398" y="186" font-size="22" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1398" dy="0">Selected GPU provider</tspan></text><text x="1398" y="215" font-size="14" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1398" dy="0">Doe OR a supported alternative</tspan></text></g><text x="1102.5" y="117" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="1102.5" dy="0">Execution host contains the receiver, Run and one selected provider</tspan></text><text x="1102.5" y="144" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="1102.5" dy="0"></tspan></text><text x="880" y="1172" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="880" dy="0">Alternative outcomes: success OR cancellation OR failure</tspan></text><text x="880" y="1199" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="880" dy="0">Local placement bypasses Poolday transport. Open Cancel or Recover for branches from the active stream; neither follows a successful answer.</tspan></text></svg>