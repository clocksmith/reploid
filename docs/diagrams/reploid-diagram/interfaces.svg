<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2040 1160" width="2040" height="1160" font-family="Arial, Helvetica, sans-serif"><title>Reploid · Doppler · Doe — Interfaces</title><desc>What each product owns. Arrows mean interface use or returned information, never ownership transfer. Intended architecture, not proof of implementation.</desc><rect width="100%" height="100%" fill="#e9e9e9"/><text x="48" y="48" font-size="27" font-weight="600" fill="#202020" text-anchor="start"><tspan x="48" dy="0">Reploid · Doppler · Doe</tspan></text><text x="48" y="79" font-size="15" font-weight="400" fill="#646464" text-anchor="start"><tspan x="48" dy="0">What each product owns. Arrows mean interface use or returned information, never ownership transfer.</tspan></text><defs><filter id="soft" x="-25%" y="-35%" width="155%" height="180%"><feDropShadow dx="8" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/><feDropShadow dx="-7" dy="-7" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.88"/></filter></defs><g data-edge="invoke-run" tabindex="0" role="button" aria-label="Identified operation
Inputs + grants + limits"><path d="M530,295.4 L780,295.4" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M530,295.4 L780,295.4" fill="none" stroke="transparent" stroke-width="22"/><polygon points="780,295.4 769,300.67999999999995 769,290.12" fill="#373737"/><rect x="542" y="228.8" width="226" height="62.4" rx="9" fill="#e9e9e9"/><text x="655" y="253.52" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="655" dy="0">Identified operation</tspan><tspan x="655" dy="23.2">Inputs + grants + limits</tspan></text></g><g data-edge="model-events" tabindex="0" role="button" aria-label="Ordered output
Identity + state"><path d="M780,476 L530,476" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M780,476 L530,476" fill="none" stroke="transparent" stroke-width="22"/><polygon points="530,476 541,470.72 541,481.28" fill="#373737"/><rect x="542" y="406.8" width="226" height="62.4" rx="9" fill="#e9e9e9"/><text x="655" y="431.52" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="655" dy="0">Ordered output</tspan><tspan x="655" dy="23.2">Identity + state</tspan></text></g><g data-edge="native-doe" tabindex="0" role="button" aria-label="Native WebGPU API
WGSL + commands"><path d="M1260,295.4 L1510,295.4" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="9 6"/><path d="M1260,295.4 L1510,295.4" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1510,295.4 1499,300.67999999999995 1499,290.12" fill="#373737"/><rect x="1272" y="228.8" width="226" height="62.4" rx="9" fill="#e9e9e9"/><text x="1385" y="253.52" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1385" dy="0">Native WebGPU API</tspan><tspan x="1385" dy="23.2">WGSL + commands</tspan></text></g><g data-edge="provider-events" tabindex="0" role="button" aria-label="Completion + failures
Measurements"><path d="M1510,476 L1260,476" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M1510,476 L1260,476" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1260,476 1271,470.72 1271,481.28" fill="#373737"/><rect x="1272" y="406.8" width="226" height="62.4" rx="9" fill="#e9e9e9"/><text x="1385" y="431.52" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1385" dy="0">Completion + failures</tspan><tspan x="1385" dy="23.2">Measurements</tspan></text></g><g data-edge="other-provider-use" tabindex="0" role="button" aria-label="Alternative provider
No Doe required"><path d="M1020,605 L1020,830" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="9 6"/><path d="M1020,605 L1020,830" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1020,830 1014.72,819 1025.28,819" fill="#373737"/><rect x="1034" y="688.8" width="224" height="62.4" rx="9" fill="#e9e9e9"/><text x="1146" y="713.52" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1146" dy="0">Alternative provider</tspan><tspan x="1146" dy="23.2">No Doe required</tspan></text></g><g data-edge="independent-doe-use" tabindex="0" role="button" aria-label="Independent consumers
No Doppler required"><path d="M1750,830 L1750,605" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="9 6"/><path d="M1750,830 L1750,605" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1750,605 1755.28,616 1744.72,616" fill="#373737"/><rect x="1773" y="688.8" width="214" height="62.4" rx="9" fill="#e9e9e9"/><text x="1880" y="713.52" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1880" dy="0">Independent consumers</tspan><tspan x="1880" dy="23.2">No Doppler required</tspan></text></g><g data-node="A" tabindex="0" role="button" aria-label="Reploid + Poolday: Coordination and authorized exchange" style="cursor:grab"><rect x="50" y="175" width="480" height="430" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="74" y="206" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="74" dy="0">A</tspan></text><text x="74" y="246" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Reploid + Poolday</tspan></text><text x="74" y="277" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="74" dy="0">Coordination and authorized exchange</tspan></text><path d="M74,299 H506" stroke="#cccccc" stroke-width=".8"/><text x="74" y="328" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Owns threads, placement and strategy</tspan></text><text x="74" y="357" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Poolday carries authorized peer traffic</tspan></text><text x="74" y="386" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Host supplies credentials and grants</tspan></text><text x="74" y="415" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Excludes model math and GPU internals</tspan></text><text x="74" y="578" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="74" dy="0">Invokes Run on a selected execution host.</tspan></text></g><g data-node="B" tabindex="0" role="button" aria-label="Doppler: Rig prepares. Run executes." style="cursor:grab"><rect x="780" y="175" width="480" height="430" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="804" y="206" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="804" dy="0">B</tspan></text><text x="804" y="246" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="804" dy="0">Doppler</tspan></text><text x="804" y="277" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="804" dy="0">Rig prepares. Run executes.</tspan></text><path d="M804,299 H1236" stroke="#cccccc" stroke-width=".8"/><text x="804" y="328" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="804" dy="0">Rig: sources → ModelIR → TargetPlans</tspan></text><text x="804" y="357" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="804" dy="0">Capsule: identified code + weights</tspan></text><text x="804" y="386" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="804" dy="0">Run: operations, adapters and partitions</tspan></text><text x="804" y="415" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="804" dy="0">Owns tensors, sampling and model state</tspan></text><text x="804" y="444" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="804" dy="0">Excludes peer and application policy</tspan></text><text x="804" y="578" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="804" dy="0">Ordinary execution does not rewrite the model.</tspan></text></g><g data-node="C" tabindex="0" role="button" aria-label="Doe: Optional native execution provider" style="cursor:grab"><rect x="1510" y="175" width="480" height="430" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1534" y="206" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="1534" dy="0">C</tspan></text><text x="1534" y="246" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1534" dy="0">Doe</tspan></text><text x="1534" y="277" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1534" dy="0">Optional native execution provider</tspan></text><path d="M1534,299 H1966" stroke="#cccccc" stroke-width=".8"/><text x="1534" y="328" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1534" dy="0">Owns WGSL compilation and GPU execution</tspan></text><text x="1534" y="357" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1534" dy="0">Owns resources, queues and synchronization</tspan></text><text x="1534" y="386" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1534" dy="0">Returns completion and failure diagnostics</tspan></text><text x="1534" y="415" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1534" dy="0">Excludes model selection and quantization</tspan></text><text x="1534" y="444" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1534" dy="0">Excludes search and conversation policy</tspan></text><text x="1534" y="578" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1534" dy="0">Browser replacement requires separate integration.</tspan></text></g><g data-node="other-provider" tabindex="0" role="button" aria-label="Other GPU providers: Independent supported execution choice" style="cursor:grab"><rect x="780" y="830" width="480" height="268" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="804" y="861" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="804" dy="0">other-provider</tspan></text><text x="804" y="901" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="804" dy="0">Other GPU providers</tspan></text><text x="804" y="932" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="804" dy="0">Independent supported execution choice</tspan></text><path d="M804,954 H1236" stroke="#cccccc" stroke-width=".8"/><text x="804" y="983" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="804" dy="0">Environment-provided browser WebGPU</tspan></text><text x="804" y="1012" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="804" dy="0">Other supported native implementations</tspan></text><text x="804" y="1041" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="804" dy="0">No Doe dependency is introduced</tspan></text><text x="804" y="1071" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="804" dy="0">Select by explicit compatibility, not proximity.</tspan></text></g><g data-node="other-apps" tabindex="0" role="button" aria-label="Other applications: Frameworks, compute and rendering" style="cursor:grab"><rect x="1510" y="830" width="480" height="268" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1534" y="861" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="1534" dy="0">other-apps</tspan></text><text x="1534" y="901" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1534" dy="0">Other applications</tspan></text><text x="1534" y="932" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1534" dy="0">Frameworks, compute and rendering</tspan></text><path d="M1534,954 H1966" stroke="#cccccc" stroke-width=".8"/><text x="1534" y="983" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1534" dy="0">Use Doe without Reploid or Doppler</tspan></text><text x="1534" y="1012" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1534" dy="0">Validate general runtime improvements</tspan></text><text x="1534" y="1041" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1534" dy="0">Provide independent application evidence</tspan></text><text x="1534" y="1071" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1534" dy="0">Independent use is not a third symbiotic claim.</tspan></text></g><text x="290" y="712" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="290" dy="0">Three separate decisions</tspan></text><text x="290" y="739" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="290" dy="0">Advertised capability ≠ authorized placement ≠ accepted</tspan><tspan x="290" dy="20.3">execution.</tspan></text><text x="290" y="897" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="290" dy="0">Separate authority</tspan></text><text x="290" y="924" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="290" dy="0">Each project owns its evaluations and releases. Each recipient</tspan><tspan x="290" dy="20.3">decides which version to adopt.</tspan></text></svg>