dy="0">Application evidence</tspan></text><text x="74" y="342" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="74" dy="0">Reploid supplies authorized cases</tspan></text><path d="M74,364 H411" stroke="#cccccc" stroke-width=".8"/><text x="74" y="393" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Real tasks and observed failures</tspan></text><text x="74" y="422" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Exact identities and environment</tspan></text><text x="74" y="451" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="74" dy="0">No automatic private-data export</tspan></text></g><g data-node="ab-rig" tabindex="0" role="button" aria-label="Rig correction: Doppler owns model-side changes" style="cursor:grab"><rect x="535" y="240" width="385" height="240" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="559" y="271" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="559" dy="0">B</tspan></text><text x="559" y="311" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="559" dy="0">Rig correction</tspan></text><text x="559" y="342" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="559" dy="0">Doppler owns model-side changes</tspan></text><path d="M559,364 H896" stroke="#cccccc" stroke-width=".8"/><text x="559" y="393" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="559" dy="0">Isolate planning or kernel causes</tspan></text><text x="559" y="422" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="559" dy="0">Prepare and qualify a candidate</tspan></text><text x="559" y="451" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="559" dy="0">Keep a reference and regression cases</tspan></text></g><g data-node="ab-release" tabindex="0" role="button" aria-label="Versioned Capsule: Separate validation and release" style="cursor:grab"><rect x="1020" y="240" width="385" height="240" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1044" y="271" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="1044" dy="0">B</tspan></text><text x="1044" y="311" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1044" dy="0">Versioned Capsule</tspan></text><text x="1044" y="342" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1044" dy="0">Separate validation and release</tspan></text><path d="M1044,364 H1381" stroke="#cccccc" stroke-width=".8"/><text x="1044" y="393" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1044" dy="0">New identified implementation</tspan></text><text x="1044" y="422" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1044" dy="0">Declared scope and measured result</tspan></text><text x="1044" y="451" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1044" dy="0">No silent mutation of active Run</tspan></text></g><g data-node="ab-adopt" tabindex="0" role="button" aria-label="Application adoption: Reploid evaluates the new version" style="cursor:grab"><rect x="1505" y="240" width="385" height="240" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1529" y="271" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="1529" dy="0">A</tspan></text><text x="1529" y="311" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1529" dy="0">Application adoption</tspan></text><text x="1529" y="342" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1529" dy="0">Reploid evaluates the new version</tspan></text><path d="M1529,364 H1866" stroke="#cccccc" stroke-width=".8"/><text x="1529" y="393" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1529" dy="0">Test actual application benefit</tspan></text><text x="1529" y="422" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1529" dy="0">Adopt under reversible host grants</tspan></text><text x="1529" y="451" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1529" dy="0">Feed outcomes into strategy evaluation</tspan></text></g><g data-node="bc-source" tabindex="0" role="button" aria-label="Reproducible workload: Doppler supplies GPU evidence" style="cursor:grab"><rect x="50" y="745" width="385" height="240" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="74" y="776" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="74" dy="0">B</tspan></text><text x="74" y="816" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Reproducible workload</tspan></text><text x="74" y="847" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="74" dy="0">Doppler supplies GPU evidence</tspan></text><path d="M74,869 H411" stroke="#cccccc" stroke-width=".8"/><text x="74" y="898" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Unchanged application and inputs</tspan></text><text x="74" y="927" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Shader case plus complete workload</tspan></text><text x="74" y="956" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Opening, queries, state and failures</tspan></text></g><g data-node="bc-doe" tabindex="0" role="button" aria-label="General correction: Doe owns compiler/runtime fixes" style="cursor:grab"><rect x="535" y="745" width="385" height="240" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="559" y="776" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="559" dy="0">C</tspan></text><text x="559" y="816" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="559" dy="0">General correction</tspan></text><text x="559" y="847" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="559" dy="0">Doe owns compiler/runtime fixes</tspan></text><path d="M559,869 H896" stroke="#cccccc" stroke-width=".8"/><text x="559" y="898" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="559" dy="0">Correct the responsible backend layer</tspan></text><text x="559" y="927" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="559" dy="0">Preserve WGSL and application semantics</tspan></text><text x="559" y="956" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="559" dy="0">Avoid model-name special cases</tspan></text></g><g data-node="bc-validate" tabindex="0" role="button" aria-label="Independent comparison: Doe evaluation and versioned release" style="cursor:grab"><rect x="1020" y="745" width="385" height="240" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1044" y="776" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="1044" dy="0">C</tspan></text><text x="1044" y="816" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1044" dy="0">Independent comparison</tspan></text><text x="1044" y="847" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1044" dy="0">Doe evaluation and versioned release</tspan></text><path d="M1044,869 H1381" stroke="#cccccc" stroke-width=".8"/><text x="1044" y="898" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1044" dy="0">Matched hardware and fixed scope</tspan></text><text x="1044" y="927" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1044" dy="0">Doppler plus independent applications</tspan></text><text x="1044" y="956" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1044" dy="0">Material gain within regression limits</tspan></text></g><g data-node="bc-adopt" tabindex="0" role="button" aria-label="Provider adoption: Doppler evaluates the provider version" style="cursor:grab"><rect x="1505" y="745" width="385" height="240" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1529" y="776" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="1529" dy="0">B</tspan></text><text x="1529" y="816" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1529" dy="0">Provider adoption</tspan></text><text x="1529" y="847" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1529" dy="0">Doppler evaluates the provider version</tspan></text><path d="M1529,869 H1866" stroke="#cccccc" stroke-width=".8"/><text x="1529" y="898" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1529" dy="0">Compare the unchanged application</tspan></text><text x="1529" y="927" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1529" dy="0">Select the qualified provider explicitly</tspan></text><text x="1529" y="956" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1529" dy="0">Retain alternatives and rollback</tspan></text></g><text x="970" y="117" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="970" dy="0">Real problem → reproduce → correct owner → validate → release → benefit</tspan></text><text x="970" y="144" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="970" dy="0">Corrections stay in their responsible layer. Feedback contains authorized evidence, not implicit access to private conversations.</tspan></text><text x="970" y="187" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="970" dy="0">Loop A ↔ B · Reploid application and Doppler implementation</tspan></text><text x="970" y="214" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="970" dy="0"></tspan></text><text x="970" y="647" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="970" dy="0">Loop B ↔ C · Doppler workloads and Doe execution</tspan></text><text x="970" y="674" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="970" dy="0">Provider corrections stay in Doe; independent applications validate benefits; each consumer chooses adoption.</tspan></text><text x="970" y="1122" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="970" dy="0">Measure benefit and development efficiency</tspan></text><text x="970" y="1149" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="970" dy="0">Track reproduction-to-verified-improvement time, application outcomes, regressions and independent transfer. This engineering loop does not gate granted Reploid runtime improvement.</tspan></text></svg>