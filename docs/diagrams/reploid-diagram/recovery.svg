<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1580" width="1920" height="1580" font-family="Arial, Helvetica, sans-serif"><title>Reploid · Doppler · Doe — Recover</title><desc>Failure branch from an active attempt. Local observation of a lost peer is not an acknowledgement of remote cleanup. Intended architecture, not proof of implementation.</desc><rect width="100%" height="100%" fill="#e9e9e9"/><text x="48" y="48" font-size="27" font-weight="600" fill="#202020" text-anchor="start"><tspan x="48" dy="0">Reploid · Doppler · Doe</tspan></text><text x="48" y="79" font-size="15" font-weight="400" fill="#646464" text-anchor="start"><tspan x="48" dy="0">Failure branch from an active attempt. Local observation of a lost peer is not an acknowledgement of remote cleanup.</tspan></text><defs><filter id="soft" x="-25%" y="-35%" width="155%" height="180%"><feDropShadow dx="8" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/><feDropShadow dx="-7" dy="-7" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.88"/></filter></defs><g data-edge="device-error" tabindex="0" role="button" aria-label="Device error"><path d="M745,280.35 L325,280.35 L325,445" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="9 6"/><path d="M745,280.35 L325,280.35 L325,445" fill="none" stroke="transparent" stroke-width="22"/><polygon points="325,445 319.72,434 330.28,434" fill="#373737"/><rect x="348" y="330.4" width="190" height="39.2" rx="9" fill="#e9e9e9"/><text x="443" y="355.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="443" dy="0">Device error</tspan></text></g><g data-edge="connection-lost" tabindex="0" role="button" aria-label="Transport loss"><path d="M1175,280.35 L1595,280.35 L1595,445" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="9 6"/><path d="M1175,280.35 L1595,280.35 L1595,445" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1595,445 1589.72,434 1600.28,434" fill="#373737"/><rect x="1418" y="330.4" width="190" height="39.2" rx="9" fill="#e9e9e9"/><text x="1513" y="355.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1513" dy="0">Transport loss</tspan></text></g><g data-edge="assessed-state" tabindex="0" role="button" aria-label="Run reports continuation validity
and observed cleanup status"><path d="M325,713 L325,902.2 L735,902.2" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M325,713 L325,902.2 L735,902.2" fill="none" stroke="transparent" stroke-width="22"/><polygon points="735,902.2 724,907.48 724,896.9200000000001" fill="#373737"/><rect x="262.5" y="703.8" width="395" height="62.4" rx="9" fill="#e9e9e9"/><text x="460" y="728.52" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="460" dy="0">Run reports continuation validity</tspan><tspan x="460" dy="23.2">and observed cleanup status</tspan></text></g><g data-edge="unknown-state" tabindex="0" role="button" aria-label="Cleanup UNKNOWN
State availability must be established"><path d="M1595,713 L1595,902.2 L1185,902.2" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M1595,713 L1595,902.2 L1185,902.2" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1185,902.2 1196,896.9200000000001 1196,907.48" fill="#373737"/><rect x="1262.5" y="703.8" width="395" height="62.4" rx="9" fill="#e9e9e9"/><text x="1460" y="728.52" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1460" dy="0">Cleanup UNKNOWN</tspan><tspan x="1460" dy="23.2">State availability must be established</tspan></text></g><g data-edge="valid-resume" tabindex="0" role="button" aria-label="Valid state + fresh authority"><path d="M816,1063 L816,1130 L317.5,1130 L317.5,1240" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="9 6"/><path d="M816,1063 L816,1130 L317.5,1130 L317.5,1240" fill="none" stroke="transparent" stroke-width="22"/><polygon points="317.5,1240 312.22,1229 322.78,1229" fill="#373737"/><rect x="223" y="1130.4" width="300" height="39.2" rx="9" fill="#e9e9e9"/><text x="373" y="1155.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="373" dy="0">Valid state + fresh authority</tspan></text></g><g data-edge="new-attempt" tabindex="0" role="button" aria-label="No valid state; restart authorized"><path d="M960,1063 L960,1240" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="9 6"/><path d="M960,1063 L960,1240" fill="none" stroke="transparent" stroke-width="22"/><polygon points="960,1240 954.72,1229 965.28,1229" fill="#373737"/><rect x="957.5" y="1148.4" width="345" height="39.2" rx="9" fill="#e9e9e9"/><text x="1130" y="1173.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1130" dy="0">No valid state; restart authorized</tspan></text></g><g data-edge="cannot-recover" tabindex="0" role="button" aria-label="No authorized recovery"><path d="M1104,1063 L1104,1110 L1607.5,1110 L1607.5,1240" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="9 6"/><path d="M1104,1063 L1104,1110 L1607.5,1110 L1607.5,1240" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1607.5,1240 1602.22,1229 1612.78,1229" fill="#373737"/><rect x="1415" y="1130.4" width="300" height="39.2" rx="9" fill="#e9e9e9"/><text x="1565" y="1155.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1565" dy="0">No authorized recovery</tspan></text></g><g data-node="active" tabindex="0" role="button" aria-label="Active attempt: Starts during preparation or streaming" style="cursor:grab"><rect x="745" y="125" width="430" height="239" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="769" y="156" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="769" dy="0">active</tspan></text><text x="769" y="196" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="769" dy="0">Active attempt</tspan></text><text x="769" y="227" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="769" dy="0">Starts during preparation or streaming</tspan></text><path d="M769,249 H1151" stroke="#cccccc" stroke-width=".8"/><text x="769" y="278" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="769" dy="0">Bound model, plan and attempt identity</tspan></text><text x="769" y="307" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="769" dy="0">One thread; unrelated work stays isolated</tspan></text><text x="769" y="337" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="769" dy="0">Alternative to accepted success or cancellation.</tspan></text></g><g data-node="device-failure" tabindex="0" role="button" aria-label="Device / execution failure: Execution peer is still reachable" style="cursor:grab"><rect x="75" y="445" width="500" height="268" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="99" y="476" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="99" dy="0">device-failure</tspan></text><text x="99" y="516" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="99" dy="0">Device / execution failure</tspan></text><text x="99" y="547" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="99" dy="0">Execution peer is still reachable</tspan></text><path d="M99,569 H551" stroke="#cccccc" stroke-width=".8"/><text x="99" y="598" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="99" dy="0">Provider reports failure to Doppler Run</tspan></text><text x="99" y="627" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="99" dy="0">Run assesses state and cleanup validity</tspan></text><text x="99" y="656" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="99" dy="0">Receiver returns that assessment</tspan></text><text x="99" y="686" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="99" dy="0">Continuation validity belongs to Doppler.</tspan></text></g><g data-node="peer-lost" tabindex="0" role="button" aria-label="Peer disconnected: Observed by requester-side transport" style="cursor:grab"><rect x="1345" y="445" width="500" height="268" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1369" y="476" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="1369" dy="0">peer-lost</tspan></text><text x="1369" y="516" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1369" dy="0">Peer disconnected</tspan></text><text x="1369" y="547" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1369" dy="0">Observed by requester-side transport</tspan></text><path d="M1369,569 H1821" stroke="#cccccc" stroke-width=".8"/><text x="1369" y="598" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1369" dy="0">No reliable final settlement response</tspan></text><text x="1369" y="627" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1369" dy="0">Mark the attempt interrupted</tspan></text><text x="1369" y="656" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1369" dy="0">Mark remote cleanup knowledge unknown</tspan></text><text x="1369" y="686" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1369" dy="0">Do not invent an acknowledgement from a lost peer.</tspan></text></g><g data-node="decision" tabindex="0" role="button" aria-label="Recovery decision: Reploid rechecks evidence and grants" style="cursor:grab"><rect x="735" y="795" width="450" height="268" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="759" y="826" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="759" dy="0">decision</tspan></text><text x="759" y="866" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="759" dy="0">Recovery decision</tspan></text><text x="759" y="897" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="759" dy="0">Reploid rechecks evidence and grants</tspan></text><path d="M759,919 H1161" stroke="#cccccc" stroke-width=".8"/><text x="759" y="948" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="759" dy="0">Can the declared continuation be used?</tspan></text><text x="759" y="977" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="759" dy="0">Are plan, state, recipients and limits valid?</tspan></text><text x="759" y="1006" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="759" dy="0">Resume, start a new attempt, or stay stopped</tspan></text><text x="759" y="1036" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="759" dy="0">A stored receipt does not recreate GPU state.</tspan></text></g><g data-node="resume" tabindex="0" role="button" aria-label="Supported continuation: Only when Doppler declares valid state" style="cursor:grab"><rect x="50" y="1240" width="535" height="268" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="74" y="1271" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="74" dy="0">resume</tspan></text><text x="74" y="1311" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Supported continuation</tspan></text><text x="74" y="1342" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="74" dy="0">Only when Doppler declares valid state</tspan></text><path d="M74,1364 H561" stroke="#cccccc" stroke-width=".8"/><text x="74" y="1393" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Restore at the declared continuation point</tspan></text><text x="74" y="1422" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Bind recovered state and event ordering</tspan></text><text x="74" y="1451" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="74" dy="0">Preserve thread isolation and permissions</tspan></text><text x="74" y="1481" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="74" dy="0">Record whether cleanup is confirmed or unknown.</tspan></text></g><g data-node="restart" tabindex="0" role="button" aria-label="New attempt: When recovery is authorized but state is invalid" style="cursor:grab"><rect x="692.5" y="1240" width="535" height="268" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="716.5" y="1271" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="716.5" dy="0">restart</tspan></text><text x="716.5" y="1311" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="716.5" dy="0">New attempt</tspan></text><text x="716.5" y="1342" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="716.5" dy="0">When recovery is authorized but state is invalid</tspan></text><path d="M716.5,1364 H1203.5" stroke="#cccccc" stroke-width=".8"/><text x="716.5" y="1393" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="716.5" dy="0">Generate a new attempt identity</tspan></text><text x="716.5" y="1422" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="716.5" dy="0">Rebuild from permitted conversation context</tspan></text><text x="716.5" y="1451" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="716.5" dy="0">Keep previous partial output distinct</tspan></text><text x="716.5" y="1481" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="716.5" dy="0">Never splice restarted text into the old answer.</tspan></text></g><g data-node="stop" tabindex="0" role="button" aria-label="Remain interrupted: When no valid, authorized route exists" style="cursor:grab"><rect x="1340" y="1240" width="535" height="268" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1364" y="1271" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="1364" dy="0">stop</tspan></text><text x="1364" y="1311" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1364" dy="0">Remain interrupted</tspan></text><text x="1364" y="1342" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1364" dy="0">When no valid, authorized route exists</tspan></text><path d="M1364,1364 H1851" stroke="#cccccc" stroke-width=".8"/><text x="1364" y="1393" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1364" dy="0">Keep history and the failure visible</tspan></text><text x="1364" y="1422" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1364" dy="0">Do not automatically broaden disclosure</tspan></text><text x="1364" y="1451" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1364" dy="0">Retry only when conditions permit</tspan></text><text x="1364" y="1481" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1364" dy="0">No forced fallback to a different model or provider.</tspan></text></g><text x="955" y="482" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="955" dy="0">Preserve other work</tspan></text><text x="955" y="509" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="955" dy="0">No device-wide teardown to cancel one thread. Drop stale events by attempt</tspan><tspan x="955" dy="20.3">identity and sequence.</tspan></text></svg>