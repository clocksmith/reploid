<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1420" width="1760" height="1420" font-family="Arial, Helvetica, sans-serif"><title>Reploid · Doppler · Doe — Cancel</title><desc>A cancellation branch during streaming. Acknowledging the request, stopping output and settling owned work are different events. Intended architecture, not proof of implementation.</desc><rect width="100%" height="100%" fill="#e9e9e9"/><text x="48" y="48" font-size="27" font-weight="600" fill="#202020" text-anchor="start"><tspan x="48" dy="0">Reploid · Doppler · Doe</tspan></text><text x="48" y="79" font-size="15" font-weight="400" fill="#646464" text-anchor="start"><tspan x="48" dy="0">A cancellation branch during streaming. Acknowledging the request, stopping output and settling owned work are different events.</tspan></text><defs><filter id="soft" x="-25%" y="-35%" width="155%" height="180%"><feDropShadow dx="8" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/><feDropShadow dx="-7" dy="-7" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.88"/></filter></defs><path d="M212.5,272 V1230" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 7"/><path d="M657.5,272 V1230" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 7"/><path d="M1102.5,272 V1230" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 7"/><path d="M1547.5,272 V1230" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 7"/><path d="M25,300 H1735" stroke="#cccccc"/><text x="30" y="288" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="30" dy="0">ALT INITIATOR A · requester cancels during normal execution</tspan></text><path d="M25,410 H1735" stroke="#cccccc"/><text x="30" y="398" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="30" dy="0">ALT INITIATOR B · execution participant or its policy cancels; not a second mandatory command</tspan></text><path d="M25,545 H1735" stroke="#cccccc"/><text x="30" y="533" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="30" dy="0">COMMON CANCELLATION PATH · acknowledgements do not promise immediate GPU termination</tspan></text><path d="M25,970 H1735" stroke="#cccccc"/><text x="30" y="958" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="30" dy="0">SETTLEMENT · only after owned work and state have actually settled</tspan></text><g data-edge="requester-cancel" tabindex="0" role="button" aria-label="Requester asks to stop attempt"><path d="M212.5,340 L657.5,340" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M212.5,340 L657.5,340" fill="none" stroke="transparent" stroke-width="22"/><polygon points="657.5,340 646.5,345.28 646.5,334.72" fill="#373737"/><text x="435" y="322" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="435" dy="0">Requester asks to stop attempt</tspan></text></g><g data-edge="participant-cancel" tabindex="0" role="button" aria-label="Participant stops contributed work"><path d="M657.5,455 L212.5,455" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M657.5,455 L212.5,455" fill="none" stroke="transparent" stroke-width="22"/><polygon points="212.5,455 223.5,449.72 223.5,460.28" fill="#373737"/><text x="435" y="437" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="435" dy="0">Participant stops contributed work</tspan></text></g><g data-edge="cancel-ack" tabindex="0" role="button" aria-label="Cancellation requested: acknowledged"><path d="M657.5,600 L212.5,600" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M657.5,600 L212.5,600" fill="none" stroke="transparent" stroke-width="22"/><polygon points="212.5,600 223.5,594.72 223.5,605.28" fill="#373737"/><text x="435" y="582" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="435" dy="0">Cancellation requested: acknowledged</tspan></text></g><g data-edge="cancel-run" tabindex="0" role="button" aria-label="Cancel attempt; stop further dispatch"><path d="M657.5,675 L1102.5,675" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M657.5,675 L1102.5,675" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1102.5,675 1091.5,680.28 1091.5,669.72" fill="#373737"/><text x="880" y="657" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="880" dy="0">Cancel attempt; stop further dispatch</tspan></text></g><g data-edge="cancel-provider" tabindex="0" role="button" aria-label="Settle this attempt’s submitted work"><path d="M1102.5,750 L1547.5,750" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M1102.5,750 L1547.5,750" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1547.5,750 1536.5,755.28 1536.5,744.72" fill="#373737"/><text x="1325" y="732" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1325" dy="0">Settle this attempt’s submitted work</tspan></text></g><g data-edge="output-stop-run" tabindex="0" role="button" aria-label="Output forwarding stopped"><path d="M1102.5,825 L657.5,825" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M1102.5,825 L657.5,825" fill="none" stroke="transparent" stroke-width="22"/><polygon points="657.5,825 668.5,819.72 668.5,830.28" fill="#373737"/><text x="880" y="807" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="880" dy="0">Output forwarding stopped</tspan></text></g><g data-edge="output-stop-peer" tabindex="0" role="button" aria-label="Output stopped; settlement pending"><path d="M657.5,900 L212.5,900" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M657.5,900 L212.5,900" fill="none" stroke="transparent" stroke-width="22"/><polygon points="212.5,900 223.5,894.72 223.5,905.28" fill="#373737"/><text x="435" y="882" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="435" dy="0">Output stopped; settlement pending</tspan></text></g><g data-edge="gpu-settled" tabindex="0" role="button" aria-label="Owned GPU work reaches completion"><path d="M1547.5,1025 L1102.5,1025" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M1547.5,1025 L1102.5,1025" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1102.5,1025 1113.5,1019.72 1113.5,1030.28" fill="#373737"/><text x="1325" y="1007" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1325" dy="0">Owned GPU work reaches completion</tspan></text></g><g data-edge="run-settled" tabindex="0" role="button" aria-label="Attempt state and resources released"><path d="M1102.5,1100 L657.5,1100" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M1102.5,1100 L657.5,1100" fill="none" stroke="transparent" stroke-width="22"/><polygon points="657.5,1100 668.5,1094.72 668.5,1105.28" fill="#373737"/><text x="880" y="1082" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="880" dy="0">Attempt state and resources released</tspan></text></g><g data-edge="cleanup-confirmed" tabindex="0" role="button" aria-label="Cleanup confirmed for this attempt"><path d="M657.5,1175 L212.5,1175" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M657.5,1175 L212.5,1175" fill="none" stroke="transparent" stroke-width="22"/><polygon points="212.5,1175 223.5,1169.72 223.5,1180.28" fill="#373737"/><text x="435" y="1157" font-size="15" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="435" dy="0">Cleanup confirmed for this attempt</tspan></text></g><g data-node="Q" tabindex="0" role="button" aria-label="Reploid + Poolday: Requesting peer" style="cursor:grab"><rect x="45" y="150" width="335" height="112" rx="17" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="63" y="186" font-size="22" font-weight="600" fill="#202020" text-anchor="start"><tspan x="63" dy="0">Reploid + Poolday</tspan></text><text x="63" y="215" font-size="14" font-weight="400" fill="#646464" text-anchor="start"><tspan x="63" dy="0">Requesting peer</tspan></text></g><g data-node="R" tabindex="0" role="button" aria-label="Receiving interface: Execution peer · Reploid + Poolday" style="cursor:grab"><rect x="490" y="150" width="335" height="112" rx="17" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="508" y="186" font-size="22" font-weight="600" fill="#202020" text-anchor="start"><tspan x="508" dy="0">Receiving interface</tspan></text><text x="508" y="215" font-size="14" font-weight="400" fill="#646464" text-anchor="start"><tspan x="508" dy="0">Execution peer · Reploid + Poolday</tspan></text></g><g data-node="RUN" tabindex="0" role="button" aria-label="Doppler Run: Execution peer · model component" style="cursor:grab"><rect x="935" y="150" width="335" height="112" rx="17" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="953" y="186" font-size="22" font-weight="600" fill="#202020" text-anchor="start"><tspan x="953" dy="0">Doppler Run</tspan></text><text x="953" y="215" font-size="14" font-weight="400" fill="#646464" text-anchor="start"><tspan x="953" dy="0">Execution peer · model component</tspan></text></g><g data-node="GPU" tabindex="0" role="button" aria-label="Selected GPU provider: Doe OR a supported alternative" style="cursor:grab"><rect x="1380" y="150" width="335" height="112" rx="17" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1398" y="186" font-size="22" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1398" dy="0">Selected GPU provider</tspan></text><text x="1398" y="215" font-size="14" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1398" dy="0">Doe OR a supported alternative</tspan></text></g><text x="1102.5" y="117" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="1102.5" dy="0">Execution peer retains responsibility for its own resources</tspan></text><text x="1102.5" y="144" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="1102.5" dy="0"></tspan></text><text x="875" y="1297" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="875" dy="0">If the peer disappears: cleanup unknown, not cleanup confirmed</tspan></text><text x="875" y="1324" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="875" dy="0">Keep this attempt’s late output out of replacement attempts. Cancelling one thread must not stop unrelated threads.</tspan></text></svg>