<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1840 840" width="1840" height="840" font-family="Arial, Helvetica, sans-serif"><title>Reploid · Doppler · Doe — Adopt</title><desc>Proposed progression, not demonstrated capability. Native provider substitution and browser-engine integration are separate destinations. Intended architecture, not proof of implementation.</desc><rect width="100%" height="100%" fill="#e9e9e9"/><text x="48" y="48" font-size="27" font-weight="600" fill="#202020" text-anchor="start"><tspan x="48" dy="0">Reploid · Doppler · Doe</tspan></text><text x="48" y="79" font-size="15" font-weight="400" fill="#646464" text-anchor="start"><tspan x="48" dy="0">Proposed progression, not demonstrated capability. Native provider substitution and browser-engine integration are separate destinations.</tspan></text><defs><filter id="soft" x="-25%" y="-35%" width="155%" height="180%"><feDropShadow dx="8" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/><feDropShadow dx="-7" dy="-7" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.88"/></filter></defs><g data-edge="milestone-1-2" tabindex="0" role="button" aria-label="Assess"><path d="M415,393.5 L505,393.5" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="9 6"/><path d="M415,393.5 L505,393.5" fill="none" stroke="transparent" stroke-width="22"/><polygon points="505,393.5 494,398.78 494,388.22" fill="#373737"/><rect x="418" y="185.4" width="84" height="39.2" rx="9" fill="#e9e9e9"/><text x="460" y="210.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="460" dy="0">Assess</tspan></text></g><g data-edge="milestone-2-3" tabindex="0" role="button" aria-label="Broaden"><path d="M875,393.5 L965,393.5" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="9 6"/><path d="M875,393.5 L965,393.5" fill="none" stroke="transparent" stroke-width="22"/><polygon points="965,393.5 954,398.78 954,388.22" fill="#373737"/><rect x="878" y="185.4" width="84" height="39.2" rx="9" fill="#e9e9e9"/><text x="920" y="210.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="920" dy="0">Broaden</tspan></text></g><g data-edge="milestone-3-4" tabindex="0" role="button" aria-label="Integrate"><path d="M1335,393.5 L1425,393.5" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="9 6"/><path d="M1335,393.5 L1425,393.5" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1425,393.5 1414,398.78 1414,388.22" fill="#373737"/><rect x="1338" y="185.4" width="84" height="39.2" rx="9" fill="#e9e9e9"/><text x="1380" y="210.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1380" dy="0">Integrate</tspan></text></g><g data-node="m1" tabindex="0" role="button" aria-label="Ordinary execution: PLANNED · material advantage" style="cursor:grab"><rect x="45" y="245" width="370" height="297" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="69" y="276" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="69" dy="0">m1</tspan></text><text x="69" y="316" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="69" dy="0">Ordinary execution</tspan></text><text x="69" y="347" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="69" dy="0">PLANNED · material advantage</tspan></text><path d="M69,369 H391" stroke="#cccccc" stroke-width=".8"/><text x="69" y="398" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="69" dy="0">Run a supported unchanged application</tspan></text><text x="69" y="427" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="69" dy="0">Compare with its incumbent provider</tspan></text><text x="69" y="456" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="69" dy="0">Earn a meaningful user-valued benefit</tspan></text><text x="69" y="485" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="69" dy="0">Enforce explicit regression limits</tspan></text><text x="69" y="515" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="69" dy="0">Doe remains useful without the portfolio.</tspan></text></g><g data-node="m2" tabindex="0" role="button" aria-label="ONNX feasibility: PLANNED · substitution assessment" style="cursor:grab"><rect x="505" y="245" width="370" height="297" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="529" y="276" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="529" dy="0">m2</tspan></text><text x="529" y="316" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="529" dy="0">ONNX feasibility</tspan></text><text x="529" y="347" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="529" dy="0">PLANNED · substitution assessment</tspan></text><path d="M529,369 H851" stroke="#cccccc" stroke-width=".8"/><text x="529" y="398" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="529" dy="0">Assess ONNX Runtime integration</tspan></text><text x="529" y="427" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="529" dy="0">Identify real provider interfaces</tspan></text><text x="529" y="456" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="529" dy="0">Test compatibility and ownership</tspan></text><text x="529" y="485" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="529" dy="0">Do not assume a drop-in replacement</tspan></text><text x="529" y="515" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="529" dy="0">A feasibility study, not a support claim.</tspan></text></g><g data-node="m3" tabindex="0" role="button" aria-label="Transfer: PLANNED · independent applications" style="cursor:grab"><rect x="965" y="245" width="370" height="297" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="989" y="276" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="989" dy="0">m3</tspan></text><text x="989" y="316" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="989" dy="0">Transfer</tspan></text><text x="989" y="347" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="989" dy="0">PLANNED · independent applications</tspan></text><path d="M989,369 H1311" stroke="#cccccc" stroke-width=".8"/><text x="989" y="398" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="989" dy="0">Qualify inference, compute and rendering</tspan></text><text x="989" y="427" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="989" dy="0">Include workloads unrelated to Doppler</tspan></text><text x="989" y="456" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="989" dy="0">Retain differing hardware outcomes</tspan></text><text x="989" y="485" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="989" dy="0">Limit claims to measured environments</tspan></text><text x="989" y="515" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="989" dy="0">Independent validation prevents captive tests.</tspan></text></g><g data-node="m4" tabindex="0" role="button" aria-label="Chromium boundary: PLANNED · bounded engine integration" style="cursor:grab"><rect x="1425" y="245" width="370" height="297" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1449" y="276" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="1449" dy="0">m4</tspan></text><text x="1449" y="316" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1449" dy="0">Chromium boundary</tspan></text><text x="1449" y="347" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1449" dy="0">PLANNED · bounded engine integration</tspan></text><path d="M1449,369 H1771" stroke="#cccccc" stroke-width=".8"/><text x="1449" y="398" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1449" dy="0">Define an explicit browser-engine path</tspan></text><text x="1449" y="427" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1449" dy="0">Separate delegation from replacement</tspan></text><text x="1449" y="456" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1449" dy="0">Keep safety and compatibility boundaries</tspan></text><text x="1449" y="485" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1449" dy="0">Measure complete application behavior</tspan></text><text x="1449" y="515" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1449" dy="0">A JavaScript import cannot replace browser GPU.</tspan></text></g><text x="920" y="117" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="920" dy="0">Independent adoption stays visible</tspan></text><text x="920" y="144" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="920" dy="0">Doppler → other supported WebGPU providers. Other applications/frameworks → Doe. Neither product is captive to the other.</tspan></text><text x="920" y="627" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="920" dy="0">“Better” is an application outcome</tspan></text><text x="920" y="654" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="920" dy="0">Predeclare one material advantage and acceptable regressions elsewhere. Keep model bytes, inputs and quality requirements fixed for provider comparisons.</tspan></text><text x="920" y="747" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="920" dy="0">No automatic qualification inheritance</tspan></text><text x="920" y="774" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="920" dy="0">Doe releases its provider. Doppler and independent applications evaluate and adopt separately. Browser integration has its own evidence.</tspan></text></svg>