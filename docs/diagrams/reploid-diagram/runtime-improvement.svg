<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1940 1150" width="1940" height="1150" font-family="Arial, Helvetica, sans-serif"><title>Reploid · Doppler · Doe — Evolve</title><desc>Reploid-owned runtime improvement: protected evaluation and reversible adoption under operator grants. Intended architecture, not proof of implementation.</desc><rect width="100%" height="100%" fill="#e9e9e9"/><text x="48" y="48" font-size="27" font-weight="600" fill="#202020" text-anchor="start"><tspan x="48" dy="0">Reploid · Doppler · Doe</tspan></text><text x="48" y="79" font-size="15" font-weight="400" fill="#646464" text-anchor="start"><tspan x="48" dy="0">Reploid-owned runtime improvement: protected evaluation and reversible adoption under operator grants.</tspan></text><defs><filter id="soft" x="-25%" y="-35%" width="155%" height="180%"><feDropShadow dx="8" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/><feDropShadow dx="-7" dy="-7" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.88"/></filter></defs><g data-edge="rp-hypothesis" tabindex="0" role="button" aria-label="Propose"><path d="M600,342.5 L700,342.5" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M600,342.5 L700,342.5" fill="none" stroke="transparent" stroke-width="22"/><polygon points="700,342.5 689,347.78 689,337.22" fill="#373737"/><rect x="555" y="170.4" width="190" height="39.2" rx="9" fill="#e9e9e9"/><text x="650" y="195.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="650" dy="0">Propose</tspan></text></g><g data-edge="rp-evaluate" tabindex="0" role="button" aria-label="Evaluate"><path d="M1240,342.5 L1340,342.5" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M1240,342.5 L1340,342.5" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1340,342.5 1329,347.78 1329,337.22" fill="#373737"/><rect x="1195" y="170.4" width="190" height="39.2" rx="9" fill="#e9e9e9"/><text x="1290" y="195.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1290" dy="0">Evaluate</tspan></text></g><g data-edge="rp-decision" tabindex="0" role="button" aria-label="Request decision"><path d="M1610,465 L1610,670" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M1610,465 L1610,670" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1610,670 1604.72,659 1615.28,659" fill="#373737"/><rect x="1515" y="540.4" width="190" height="39.2" rx="9" fill="#e9e9e9"/><text x="1610" y="565.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1610" dy="0">Request decision</tspan></text></g><g data-edge="rp-adopt" tabindex="0" role="button" aria-label="If adopted"><path d="M1340,792.5 L1240,792.5" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="9 6"/><path d="M1340,792.5 L1240,792.5" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1240,792.5 1251,787.22 1251,797.78" fill="#373737"/><rect x="1195" y="620.4" width="190" height="39.2" rx="9" fill="#e9e9e9"/><text x="1290" y="645.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1290" dy="0">If adopted</tspan></text></g><g data-edge="rp-observed-use" tabindex="0" role="button" aria-label="Retain results"><path d="M700,792.5 L600,792.5" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M700,792.5 L600,792.5" fill="none" stroke="transparent" stroke-width="22"/><polygon points="600,792.5 611,787.22 611,797.78" fill="#373737"/><rect x="555" y="620.4" width="190" height="39.2" rx="9" fill="#e9e9e9"/><text x="650" y="645.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="650" dy="0">Retain results</tspan></text></g><g data-edge="rp-next" tabindex="0" role="button" aria-label="Next hypothesis"><path d="M330,670 L330,465" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M330,670 L330,465" fill="none" stroke="transparent" stroke-width="22"/><polygon points="330,465 335.28,476 324.72,476" fill="#373737"/><rect x="235" y="540.4" width="190" height="39.2" rx="9" fill="#e9e9e9"/><text x="330" y="565.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="330" dy="0">Next hypothesis</tspan></text></g><g data-edge="rp-rejected" tabindex="0" role="button" aria-label="Rejected / failed: retain current version"><path d="M1610,915 L1610,1000 L330,1000 L330,915" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M1610,915 L1610,1000 L330,1000 L330,915" fill="none" stroke="transparent" stroke-width="22"/><polygon points="330,915 335.28,926 324.72,926" fill="#373737"/><rect x="690" y="980.4" width="560" height="39.2" rx="9" fill="#e9e9e9"/><text x="970" y="1005.12" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="970" dy="0">Rejected / failed: retain current version</tspan></text></g><g data-node="rp-observe" tabindex="0" role="button" aria-label="Observed problem: Reploid retains the task outcome" style="cursor:grab"><rect x="60" y="220" width="540" height="245" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="84" y="251" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="84" dy="0">A</tspan></text><text x="84" y="291" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="84" dy="0">Observed problem</tspan></text><text x="84" y="322" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="84" dy="0">Reploid retains the task outcome</tspan></text><path d="M84,344 H576" stroke="#cccccc" stroke-width=".8"/><text x="84" y="373" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="84" dy="0">Identify failure or useful opportunity</tspan></text><text x="84" y="402" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="84" dy="0">Freeze the objective and baseline</tspan></text><text x="84" y="431" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="84" dy="0">Keep provenance and resource costs</tspan></text></g><g data-node="rp-propose" tabindex="0" role="button" aria-label="Proposed change: Agent proposes; authority stays separate" style="cursor:grab"><rect x="700" y="220" width="540" height="245" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="724" y="251" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="724" dy="0">A</tspan></text><text x="724" y="291" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="724" dy="0">Proposed change</tspan></text><text x="724" y="322" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="724" dy="0">Agent proposes; authority stays separate</tspan></text><path d="M724,344 H1216" stroke="#cccccc" stroke-width=".8"/><text x="724" y="373" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="724" dy="0">Candidate tool or strategy generation</tspan></text><text x="724" y="402" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="724" dy="0">Declare a falsifiable hypothesis</tspan></text><text x="724" y="431" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="724" dy="0">Cannot edit evaluator or grant</tspan></text></g><g data-node="rp-compare" tabindex="0" role="button" aria-label="Protected comparison: Independent host evaluation" style="cursor:grab"><rect x="1340" y="220" width="540" height="245" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1364" y="251" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="1364" dy="0">A</tspan></text><text x="1364" y="291" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1364" dy="0">Protected comparison</tspan></text><text x="1364" y="322" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1364" dy="0">Independent host evaluation</tspan></text><path d="M1364,344 H1856" stroke="#cccccc" stroke-width=".8"/><text x="1364" y="373" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1364" dy="0">Isolated baseline/candidate execution</tspan></text><text x="1364" y="402" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1364" dy="0">Frozen tests, metrics and thresholds</tspan></text><text x="1364" y="431" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1364" dy="0">Retain failures and paired observations</tspan></text></g><g data-node="rp-decide" tabindex="0" role="button" aria-label="Adopt or reject: Separate operator-controlled decision" style="cursor:grab"><rect x="1340" y="670" width="540" height="245" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1364" y="701" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="1364" dy="0">A</tspan></text><text x="1364" y="741" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1364" dy="0">Adopt or reject</tspan></text><text x="1364" y="772" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1364" dy="0">Separate operator-controlled decision</tspan></text><path d="M1364,794 H1856" stroke="#cccccc" stroke-width=".8"/><text x="1364" y="823" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1364" dy="0">Passing does not activate a candidate</tspan></text><text x="1364" y="852" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1364" dy="0">Adopt only within explicit grants</tspan></text><text x="1364" y="881" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1364" dy="0">Keep prior version for rollback</tspan></text></g><g data-node="rp-use" tabindex="0" role="button" aria-label="Subsequent use: Reploid executes the selected version" style="cursor:grab"><rect x="700" y="670" width="540" height="245" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="724" y="701" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="724" dy="0">A</tspan></text><text x="724" y="741" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="724" dy="0">Subsequent use</tspan></text><text x="724" y="772" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="724" dy="0">Reploid executes the selected version</tspan></text><path d="M724,794 H1216" stroke="#cccccc" stroke-width=".8"/><text x="724" y="823" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="724" dy="0">Pin versions for active tasks</tspan></text><text x="724" y="852" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="724" dy="0">Observe outcomes on subsequent work</tspan></text><text x="724" y="881" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="724" dy="0">Transfer requires its own evidence</tspan></text></g><g data-node="rp-retain" tabindex="0" role="button" aria-label="Outcomes and rollback: Reploid retains complete history" style="cursor:grab"><rect x="60" y="670" width="540" height="245" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="84" y="701" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="84" dy="0">A</tspan></text><text x="84" y="741" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="84" dy="0">Outcomes and rollback</tspan></text><text x="84" y="772" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="84" dy="0">Reploid retains complete history</tspan></text><path d="M84,794 H576" stroke="#cccccc" stroke-width=".8"/><text x="84" y="823" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="84" dy="0">Keep rejected and failed candidates</tspan></text><text x="84" y="852" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="84" dy="0">Restore prior version when authorized</tspan></text><text x="84" y="881" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="84" dy="0">Use outcomes for the next hypothesis</tspan></text></g><text x="970" y="117" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="970" dy="0">Product operation, owned by Reploid</tspan></text><text x="970" y="144" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="970" dy="0">The intended scope includes tools and strategies. Work implements bounded pure-tool replacement; Zero/X has a separate internal episode lane.</tspan></text><text x="970" y="1062" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="970" dy="0">Intent, implementation and outcomes have separate evidence</tspan></text><text x="970" y="1089" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="970" dy="0">Fixture-based tool adoption is recorded. The retained model attempts did not qualify a repair; independent-recipient adoption and causal recursion remain unproved. Select a node or edge for the owning contracts and report.</tspan></text></svg>