<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1840 1120" width="1840" height="1120" font-family="Arial, Helvetica, sans-serif"><title>Reploid · Doppler · Doe — Placement</title><desc>Products are components inside hosts. A local invocation bypasses network transport; a remote invocation enters a receiving peer. Intended architecture, not proof of implementation.</desc><rect width="100%" height="100%" fill="#e9e9e9"/><text x="48" y="48" font-size="27" font-weight="600" fill="#202020" text-anchor="start"><tspan x="48" dy="0">Reploid · Doppler · Doe</tspan></text><text x="48" y="79" font-size="15" font-weight="400" fill="#646464" text-anchor="start"><tspan x="48" dy="0">Products are components inside hosts. A local invocation bypasses network transport; a remote invocation enters a receiving peer.</tspan></text><defs><filter id="soft" x="-25%" y="-35%" width="155%" height="180%"><feDropShadow dx="8" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/><feDropShadow dx="-7" dy="-7" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.88"/></filter></defs><g data-edge="authorized-peer-request" tabindex="0" role="button" aria-label="REMOTE · authorized request
Poolday WebRTC → receiving interface"><path d="M555,334.5 L1125,334.5" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M555,334.5 L1125,334.5" fill="none" stroke="transparent" stroke-width="22"/><polygon points="1125,334.5 1114,339.78 1114,329.22" fill="#373737"/><rect x="605" y="268.8" width="470" height="62.4" rx="9" fill="#e9e9e9"/><text x="840" y="293.52" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="840" dy="0">REMOTE · authorized request</tspan><tspan x="840" dy="23.2">Poolday WebRTC → receiving interface</tspan></text></g><g data-edge="peer-output" tabindex="0" role="button" aria-label="Ordered events → requester checks
Accepted execution is a separate state"><path d="M1125,487.8 L555,487.8" fill="none" stroke="#373737" stroke-width="1.8" stroke-dasharray="2 6"/><path d="M1125,487.8 L555,487.8" fill="none" stroke="transparent" stroke-width="22"/><polygon points="555,487.8 566,482.52000000000004 566,493.08" fill="#373737"/><rect x="605" y="423.8" width="470" height="62.4" rx="9" fill="#e9e9e9"/><text x="840" y="448.52" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="840" dy="0">Ordered events → requester checks</tspan><tspan x="840" dy="23.2">Accepted execution is a separate state</tspan></text></g><g data-edge="local-bypass" tabindex="0" role="button" aria-label="LOCAL · direct invocation
No network transport"><path d="M305,590 L305,795" fill="none" stroke="#373737" stroke-width="1.8" /><path d="M305,590 L305,795" fill="none" stroke="transparent" stroke-width="22"/><polygon points="305,795 299.72,784 310.28,784" fill="#373737"/><rect x="335" y="660.8" width="290" height="62.4" rx="9" fill="#e9e9e9"/><text x="480" y="685.52" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="480" dy="0">LOCAL · direct invocation</tspan><tspan x="480" dy="23.2">No network transport</tspan></text></g><g data-node="requesting-peer" tabindex="0" role="button" aria-label="Requesting peer: Human/agent thread · Reploid + Poolday" style="cursor:grab"><rect x="55" y="225" width="500" height="365" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="79" y="256" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="79" dy="0">A</tspan></text><text x="79" y="296" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="79" dy="0">Requesting peer</tspan></text><text x="79" y="327" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="79" dy="0">Human/agent thread · Reploid + Poolday</tspan></text><path d="M79,349 H531" stroke="#cccccc" stroke-width=".8"/><text x="79" y="378" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="79" dy="0">Reploid owns thread context and placement</tspan></text><text x="79" y="407" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="79" dy="0">Poolday owns the remote request boundary</tspan></text><text x="79" y="436" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="79" dy="0">Check advertised capability separately</tspan></text><text x="79" y="465" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="79" dy="0">Bind grants, recipients and resource limits</tspan></text><text x="79" y="494" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="79" dy="0">Select local OR remote execution</tspan></text><text x="79" y="563" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="79" dy="0">Joining a mesh does not disclose a conversation.</tspan></text></g><g data-node="execution-peer" tabindex="0" role="button" aria-label="Execution peer: Receiving coordination → Run → provider" style="cursor:grab"><rect x="1125" y="225" width="655" height="365" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1149" y="256" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="1149" dy="0">execution-peer</tspan></text><text x="1149" y="296" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1149" dy="0">Execution peer</tspan></text><text x="1149" y="327" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1149" dy="0">Receiving coordination → Run → provider</tspan></text><path d="M1149,349 H1756" stroke="#cccccc" stroke-width=".8"/><text x="1149" y="378" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1149" dy="0">Receiving Reploid / Poolday validates requests</tspan></text><text x="1149" y="407" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1149" dy="0">Doppler Run executes the identified implementation</tspan></text><text x="1149" y="436" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1149" dy="0">Doe OR another supported provider executes GPU work</tspan></text><text x="1149" y="465" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1149" dy="0">Host owns this attempt’s admission and cleanup</tspan></text><text x="1149" y="494" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1149" dy="0">Acceptance remains a separate requester decision</tspan></text><text x="1149" y="563" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1149" dy="0">Doppler is not a remotely addressable peer by itself.</tspan></text></g><g data-node="local-execution" tabindex="0" role="button" aria-label="Same requesting device: Local receiving interface → Run → provider" style="cursor:grab"><rect x="55" y="795" width="500" height="268" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="79" y="826" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="79" dy="0">local-execution</tspan></text><text x="79" y="866" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="79" dy="0">Same requesting device</tspan></text><text x="79" y="897" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="79" dy="0">Local receiving interface → Run → provider</tspan></text><path d="M79,919 H531" stroke="#cccccc" stroke-width=".8"/><text x="79" y="948" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="79" dy="0">No WebRTC request or payload transfer</tspan></text><text x="79" y="977" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="79" dy="0">Use the same model and state contracts</tspan></text><text x="79" y="1006" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="79" dy="0">Select Doe OR another supported provider</tspan></text><text x="79" y="1036" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="79" dy="0">Still enforce identity, budgets and cancellation.</tspan></text></g><text x="920" y="122" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="920" dy="0">Advertised capability → authorized placement → accepted execution</tspan></text><text x="920" y="149" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="920" dy="0">These are distinct states with different evidence and authority; never combine them into one “eligible” badge.</tspan></text><text x="1225" y="672" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="1225" dy="0">Every request binds its contract</tspan></text><text x="1225" y="699" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="1225" dy="0">Attempt and implementation/Capsule identity · operation · permitted inputs · resource limits · cancellation handle.</tspan></text><text x="1225" y="847" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="1225" dy="0">Model partitioning requires additional execution hosts</tspan></text><text x="1225" y="874" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="1225" dy="0">Each participating host owns its local Run, selected provider and state. Poolday carries authorized intermediate tensors; the whole-request</tspan><tspan x="1225" dy="20.3">example does not prove a split.</tspan></text></svg>