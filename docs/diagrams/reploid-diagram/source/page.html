<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reploid · Doppler · Doe | Relationship graph</title>
<style>
:root{--background:#e9e9e9;--surface:#eeeeee;--text:#202020;--muted:#646464;--line:#373737;--border:#ccc;color-scheme:light;font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;font-size:13px;color:inherit;background:none;border:1px solid transparent;border-radius:9px;padding:9px 13px;cursor:pointer;white-space:nowrap}
button:hover{background:#ffffff77}button:focus-visible,[tabindex]:focus-visible{outline:2px solid #333;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}
header{padding:27px 34px 20px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #d3d3d3;flex-wrap:wrap}
.brand{flex:1;min-width:250px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--muted);margin-bottom:9px}h1{font-size:27px;letter-spacing:-.9px;line-height:1.1;font-weight:600;margin:0}
.actions{display:flex;gap:4px;align-items:center}.raised{background:var(--surface);border-color:#d0d0d0;box-shadow:4px 4px 12px #0000000d,-4px -4px 12px #ffffff9c}
.toolbar{padding:16px 34px 10px;display:flex;align-items:center;gap:16px}.tabs{display:flex;min-width:0;max-width:100%;overflow-x:auto;padding:4px;border-radius:12px;box-shadow:inset 2px 2px 5px #0000000c,inset -2px -2px 5px #ffffffa6}.tabs button[aria-selected=true]{background:var(--surface);box-shadow:2px 3px 7px #00000012,-2px -2px 6px #ffffffb0}
.tools{display:flex;gap:3px;margin-left:auto;align-items:center}#zoom-label{font-size:11px;color:var(--muted);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}#view-description{padding:0 34px;margin:0;font-size:12px;line-height:1.6;color:var(--muted)}
.workspace{position:relative;flex:1;min-height:230px;display:flex}#stage{flex:1;position:relative;overflow:hidden;touch-action:none;min-width:0;cursor:grab}#stage:active{cursor:grabbing}.three-layer,#diagram{position:absolute;left:0;top:0;width:100%;height:100%}#diagram{z-index:2;overflow:visible}#world{font-family:Arial,Helvetica,sans-serif;user-select:none}#world [data-node]:focus rect{stroke:#333;stroke-width:2}#world [data-edge]{cursor:pointer}
.drawer{position:absolute;right:20px;top:18px;bottom:20px;z-index:4;width:335px;overflow:auto;border:1px solid var(--border);border-radius:20px;background:#f1f1f1f5;padding:25px;box-shadow:10px 10px 30px #00000014,-5px -5px 15px #ffffffb0;backdrop-filter:blur(12px)}.drawer[hidden]{display:none}.drawer>button{position:absolute;right:10px;top:10px}.drawer small{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}.drawer h2{font-size:24px;margin:15px 0 10px}.drawer h3{font-size:12px;text-transform:uppercase;letter-spacing:.7px;margin:24px 0 10px}.drawer p{font-size:13px;line-height:1.65;margin:9px 0}.detail-link{display:block;margin:12px 0;border:1px solid var(--border);background:var(--surface);width:100%;text-align:left}
footer{padding:12px 34px 17px;border-top:1px solid #d3d3d3;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}#legend{display:flex;gap:20px;align-items:center;flex-wrap:wrap}#legend>span{display:flex;gap:8px;align-items:center}#legend svg{width:45px;height:15px}#status{margin-left:auto;max-width:530px;line-height:1.5}.tip{color:#777;font-size:10px;white-space:nowrap}
dialog{width:min(900px,94vw);height:86dvh;background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:22px;color:var(--text)}dialog::backdrop{background:#0005;backdrop-filter:blur(4px)}.editor-box{display:flex;flex-direction:column;height:100%;gap:14px}.editor-top{display:flex;justify-content:space-between;align-items:center}.editor-top h2{font-size:18px;margin:0}#json-editor{flex:1;resize:none;width:100%;border:1px solid #ccc;border-radius:10px;background:#fafafa;color:#222;padding:16px;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}#editor-error{font-size:13px;min-height:18px}.editor-bottom{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
@media(max-width:800px){header{padding:20px 18px 14px;gap:14px}h1{font-size:23px}.actions{gap:0}.actions button{padding:8px}.toolbar{padding:13px 18px 9px;flex-wrap:wrap;gap:8px}.tools{margin-left:0}#view-description{padding:0 18px;font-size:11px}footer{padding:10px 18px;gap:8px}#status{display:none}.drawer{width:min(335px,calc(100vw - 28px));right:14px}.tip{display:none}}
</style>
</head>
<body>
<header><div class="brand"><div class="eyebrow">SYSTEM MAP / JSON</div><h1 id="document-title">Reploid · Doppler · Doe</h1></div><div class="actions"><button id="load-json">Load JSON</button><button id="edit-json">Edit JSON</button><button id="export-json" class="raised">Export JSON</button><button id="export-svg">Export SVG</button></div></header>
<div class="toolbar"><nav class="tabs" id="tabs" role="tablist" aria-label="Diagram views"></nav><div class="tools"><button id="engine" class="raised" title="Use locally installed Three.js">SVG</button><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="Zoom in">+</button><button id="fit">Fit</button><button id="details-toggle" aria-expanded="false">Details</button></div></div>
<p id="view-description"></p>
<div class="workspace"><main id="stage" aria-label="Interactive relationship diagram"><svg id="diagram" xmlns="http://www.w3.org/2000/svg" aria-label="Boxes and labeled relationships"><g id="world"></g></svg></main><aside id="details" class="drawer" hidden><button id="details-close" aria-label="Close details">×</button><div id="details-content"></div></aside></div>
<footer><div id="legend"></div><span class="tip">Drag boxes · Drag background to pan · Scroll to zoom</span><span id="status" role="status">Intended architecture. Not a qualification report.</span></footer>
<input type="file" accept=".json,application/json" id="json-file" hidden>
<dialog id="editor"><div class="editor-box"><div class="editor-top"><h2>Diagram JSON</h2><button id="editor-cancel">Close</button></div><textarea id="json-editor" spellcheck="false" aria-label="Diagram JSON"></textarea><div id="editor-error" role="alert"></div><div class="editor-bottom"><span>Data only. Changes are applied locally.</span><button class="raised" id="editor-apply">Validate and render</button></div></div></dialog>
<script id="diagram-data" type="application/json">__DIAGRAM_DATA__</script>

</body></html>
