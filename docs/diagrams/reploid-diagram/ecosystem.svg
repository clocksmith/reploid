<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 590" width="1600" height="590" font-family="Arial, Helvetica, sans-serif"><title>Reploid · Doppler · Doe — Products</title><desc>Intended user benefits. Only A–B and B–C are asserted symbiotic relationships. Intended architecture, not proof of implementation.</desc><rect width="100%" height="100%" fill="#e9e9e9"/><text x="48" y="48" font-size="27" font-weight="600" fill="#202020" text-anchor="start"><tspan x="48" dy="0">Reploid · Doppler · Doe</tspan></text><text x="48" y="79" font-size="15" font-weight="400" fill="#646464" text-anchor="start"><tspan x="48" dy="0">Intended user benefits. Only A–B and B–C are asserted symbiotic relationships.</tspan></text><defs><filter id="soft" x="-25%" y="-35%" width="155%" height="180%"><feDropShadow dx="8" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/><feDropShadow dx="-7" dy="-7" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.88"/></filter></defs><g data-edge="A-B" tabindex="0" role="button" aria-label="Real workloads
