Better GPU execution"><path d="M980,284 L1192,284" fill="none" stroke="#373737" stroke-width="2.2" /><path d="M980,284 L1192,284" fill="none" stroke="transparent" stroke-width="22"/><rect x="990" y="204.8" width="192" height="62.4" rx="9" fill="#e9e9e9"/><text x="1086" y="229.52" font-size="16" font-weight="400" fill="#373737" text-anchor="middle"><tspan x="1086" dy="0">Application pressure</tspan><tspan x="1086" dy="23.2">Better GPU execution</tspan></text></g><g data-node="A" tabindex="0" role="button" aria-label="Reploid: Collaborate beyond one device" style="cursor:grab"><rect x="48" y="150" width="360" height="268" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="72" y="181" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="72" dy="0">A</tspan></text><text x="72" y="221" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="72" dy="0">Reploid</tspan></text><text x="72" y="252" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="72" dy="0">Collaborate beyond one device</tspan></text><path d="M72,274 H384" stroke="#cccccc" stroke-width=".8"/><text x="72" y="303" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="72" dy="0">Pool participating devices’ capabilities</tspan></text><text x="72" y="332" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="72" dy="0">Share models, compute and agent work</tspan></text><text x="72" y="361" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="72" dy="0">Improve collective problem solving</tspan></text><text x="72" y="391" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="72" dy="0">The network is the product.</tspan></text></g><g data-node="B" tabindex="0" role="button" aria-label="Doppler: Integrate portable model computation" style="cursor:grab"><rect x="620" y="150" width="360" height="268" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="644" y="181" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="644" dy="0">B</tspan></text><text x="644" y="221" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="644" dy="0">Doppler</tspan></text><text x="644" y="252" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="644" dy="0">Integrate portable model computation</tspan></text><path d="M644,274 H956" stroke="#cccccc" stroke-width=".8"/><text x="644" y="303" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="644" dy="0">Use a straightforward model interface</tspan></text><text x="644" y="332" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="644" dy="0">Run identified implementations</tspan></text><text x="644" y="361" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="644" dy="0">Adopt improvements without lock-in</tspan></text><text x="644" y="391" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="644" dy="0">Useful without Reploid or Doe.</tspan></text></g><g data-node="C" tabindex="0" role="button" aria-label="Doe: Run GPU applications better" style="cursor:grab"><rect x="1192" y="150" width="360" height="268" rx="24" fill="#eeeeee" stroke="#cccccc" stroke-width="0.8" filter="url(#soft)"/><text x="1216" y="181" font-size="12" font-weight="600" fill="#646464" text-anchor="start"><tspan x="1216" dy="0">C</tspan></text><text x="1216" y="221" font-size="29" font-weight="600" fill="#202020" text-anchor="start"><tspan x="1216" dy="0">Doe</tspan></text><text x="1216" y="252" font-size="16" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1216" dy="0">Run GPU applications better</tspan></text><path d="M1216,274 H1528" stroke="#cccccc" stroke-width=".8"/><text x="1216" y="303" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1216" dy="0">Keep supported applications unchanged</tspan></text><text x="1216" y="332" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1216" dy="0">Earn a material execution advantage</tspan></text><text x="1216" y="361" font-size="15" font-weight="400" fill="#202020" text-anchor="start"><tspan x="1216" dy="0">Respect declared regression limits</tspan></text><text x="1216" y="391" font-size="13" font-weight="400" fill="#646464" text-anchor="start"><tspan x="1216" dy="0">Useful beyond Doppler.</tspan></text></g><text x="800" y="486" font-size="18" font-weight="600" fill="#202020" text-anchor="middle"><tspan x="800" dy="0">Independent adoption. Shared progress.</tspan></text><text x="800" y="513" font-size="14" font-weight="400" fill="#646464" text-anchor="middle"><tspan x="800" dy="0">Mutual benefit is not a required dependency. Sharing Doppler as a neighbor creates no direct Reploid–Doe relationship.</tspan></text></svg>