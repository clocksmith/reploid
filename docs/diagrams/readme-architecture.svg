<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="title desc">
<title id="title">Reploid coordinates computers running different parts of one model</title>
<desc id="desc">A requester holds a conversation without model weights. A separate storage participant supplies pieces over dotted preparation links. Two contributors retain different model layer ranges and run them through Doppler, exchanging intermediate computation over WebRTC. Streamed output returns to the requester. Small repeated marks represent Reploid coordination on participants.</desc>
