<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title desc">
<title id="title">One ready peer answers a requester that holds no model weights</title>
<desc id="desc">A requester types a question and presses Send once. Reploid joins the mesh and picks an available model. One ready peer that already holds the whole model runs it with Doppler and streams the answer back. The serving computer can read the prompt it executes.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}</style>
<defs>
<marker id="ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#08090c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#2f6bff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="378" rx="18" fill="#ffffff" stroke="#dedfe5"/>
<text x="48" y="51" font-size="21" fill="#08090c" font-weight="650" letter-spacing="-.6">reploid</text>
<text x="1152" y="51" font-size="12" fill="#747780" font-weight="500" text-anchor="end" letter-spacing="2">LAUNCH / ONE READY PEER</text>
<path d="M48 74 H1152" fill="none" stroke="#dedfe5" stroke-width="1"/>
<rect x="49" y="120" width="380" height="200" rx="16" fill="#ffffff" stroke="#08090c" stroke-width="1.5"/>
<text x="73" y="156" font-size="17" fill="#08090c" font-weight="550">You</text>
<path d="M49 172 H429" fill="none" stroke="#dedfe5" stroke-width="1"/>
<rect x="73" y="190" width="332" height="44" rx="8" fill="#fafafa" stroke="#dedfe5"/>
<text x="89" y="218" font-size="14" fill="#08090c">Type a question, press Send once</text>
<text x="73" y="266" font-size="13" fill="#747780">No model weights on this device</text>
<text x="73" y="290" font-size="13" fill="#747780">Model chosen automatically; you can change it</text>
<rect x="771" y="120" width="380" height="200" rx="16" fill="#ffffff" stroke="#08090c" stroke-width="1.5"/>
<text x="795" y="156" font-size="17" fill="#08090c" font-weight="550">Ready peer</text>
<path d="M771 172 H1151" fill="none" stroke="#dedfe5" stroke-width="1"/>
<rect x="795" y="190" width="332" height="44" rx="8" fill="#fafafa" stroke="#dedfe5"/>
<text x="811" y="218" font-size="14" fill="#08090c" class="mono">whole model · Doppler</text>
<text x="795" y="266" font-size="13" fill="#747780">Weights already resident</text>
<text x="795" y="290" font-size="13" fill="#747780">Can read the prompt it executes</text>
<path d="M441 200 H759" fill="none" stroke="#08090c" stroke-width="1.5" marker-end="url(#ink)"/>
<text x="600" y="188" font-size="13" fill="#08090c" text-anchor="middle">prompt</text>
<path d="M759 262 H441" fill="none" stroke="#2f6bff" stroke-width="1.5" marker-end="url(#blue)"/>
<text x="600" y="286" font-size="13" fill="#2f6bff" text-anchor="middle">streamed answer</text>
</svg>
