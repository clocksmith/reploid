<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 736" width="360" height="736" role="img" aria-labelledby="title desc">
<title id="title">One model across participating computers</title>
<desc id="desc">A conversation with no model weights sends a request to two contributors in sequence. Doppler executes the first layers on contributor A and the remaining layers on contributor B, linked by WebRTC. A separate storage participant supplies pieces over dotted links on the right. The solid blue path on the left returns streamed output to the conversation. Small repeated marks represent Reploid coordination.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<defs>
  <marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#ff1f3d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8b5cf6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#2f6bff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="gray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#747780" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <g id="coordination">
    <path d="M0 5 L7 0 L14 5 L7 10 Z" fill="none" stroke="#08090c" stroke-width="1.3" stroke-linejoin="round"/>
    <circle cx="0" cy="5" r="2" fill="#ff1f3d"/>
    <circle cx="7" cy="0" r="2" fill="#8b5cf6"/>
    <circle cx="14" cy="5" r="2" fill="#2f6bff"/>
  </g>
</defs>
<rect x="1" y="1" width="358" height="734" rx="18" fill="#ffffff" stroke="#dedfe5"/>
<text x="26" y="39" font-size="21" fill="#08090c" font-weight="650" letter-spacing="-.6">reploid</text>
<path d="M26 58 H334" stroke="#dedfe5"/>

<rect x="34" y="84" width="220" height="154" rx="12" fill="#ffffff" stroke="#08090c" stroke-width="1.5"/>
<text x="50" y="111" font-size="20" fill="#08090c" font-weight="550">You</text>
<use href="#coordination" x="221" y="98"/>
<text x="50" y="132" font-size="14" fill="#747780">No model weights</text>
<rect x="50" y="146" width="188" height="35" rx="7" fill="#fafafa" stroke="#dedfe5"/>
<text x="61" y="169" font-size="16" fill="#08090c">Explain this passage.</text>
<rect x="50" y="193" width="188" height="29" rx="6" fill="#f5f7ff"/>
<text x="61" y="213" font-size="15" fill="#08090c">Here’s the explanation…</text>

<text x="308" y="258" text-anchor="middle" font-size="14" fill="#747780" font-weight="550">Storage</text>
<rect x="285" y="282" width="45" height="19" rx="4" fill="#fafafa" stroke="#dedfe5"/>
<rect x="289" y="277" width="45" height="19" rx="4" fill="#fafafa" stroke="#dedfe5"/>
<rect x="293" y="272" width="45" height="19" rx="4" fill="#fafafa" stroke="#dedfe5"/>
<rect x="299" y="278" width="7" height="7" rx="1" fill="#ff1f3d"/>
<rect x="309" y="278" width="7" height="7" rx="1" fill="#8b5cf6"/>
<rect x="319" y="278" width="7" height="7" rx="1" fill="#2f6bff"/>
<path d="M318 301 V593 H260" fill="none" stroke="#747780" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 7" marker-end="url(#gray)"/>
<path d="M318 376 H260" fill="none" stroke="#747780" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#gray)"/>

<rect x="34" y="300" width="220" height="147" rx="12" fill="#ffffff" stroke="#08090c" stroke-width="1.5"/>
<text x="50" y="327" font-size="17" fill="#08090c" font-weight="550">Contributor A</text>
<rect x="55" y="354" width="176" height="52" rx="7" fill="#fff1f3" stroke="#f0b7c0"/>
<rect x="60" y="347" width="176" height="52" rx="7" fill="#fff1f3" stroke="#f0b7c0"/>
<rect x="65" y="340" width="176" height="52" rx="7" fill="#ff1f3d"/>
<text x="82" y="373" font-size="20" fill="#ffffff" font-weight="600">First layers</text>
<text x="50" y="430" font-size="14" fill="#747780" font-weight="550">Doppler</text>
<use href="#coordination" x="221" y="419"/>

<rect x="34" y="517" width="220" height="147" rx="12" fill="#ffffff" stroke="#08090c" stroke-width="1.5"/>
<text x="50" y="544" font-size="17" fill="#08090c" font-weight="550">Contributor B</text>
<rect x="55" y="571" width="176" height="52" rx="7" fill="#eee8ff" stroke="#cbb9f2"/>
<rect x="60" y="564" width="176" height="52" rx="7" fill="#eee8ff" stroke="#cbb9f2"/>
<rect x="65" y="557" width="176" height="52" rx="7" fill="#8b5cf6"/>
<text x="74" y="590" font-size="18" fill="#ffffff" font-weight="600">Remaining layers</text>
<text x="50" y="647" font-size="14" fill="#747780" font-weight="550">Doppler</text>
<use href="#coordination" x="221" y="636"/>

<path d="M144 238 V293" fill="none" stroke="#ff1f3d" stroke-width="2.6" stroke-linecap="round" marker-end="url(#red)"/>
<path d="M144 447 V510" fill="none" stroke="#8b5cf6" stroke-width="2.6" stroke-linecap="round" marker-end="url(#purple)"/>
<text x="164" y="487" font-size="14" fill="#747780" font-weight="500">WebRTC</text>
<path d="M144 664 V681 Q144 689 136 689 H24 Q16 689 16 681 V216 Q16 207 25 207 H44" fill="none" stroke="#2f6bff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="180" y="718" text-anchor="middle" font-size="15" fill="#747780">One model across computers.</text>
</svg>
